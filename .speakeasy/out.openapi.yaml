  /v1/etb:
    get:
      description: "Returns every symbol on today's easy-to-borrow (ETB) list: the complete set of US equities that can be sold short without first locating shares. A symbol on the list is easy to borrow and can be shorted normally; a symbol absent from it is hard to borrow (HTB) and cannot be shorted without a locate. Absence is a positive answer, not missing data. The list is replaced once per trading day before the market opens and does not change intraday. It is not account-scoped — borrowability is a property of the symbol, so every caller gets the same answer. The response can reach a few hundred KB because the borrowable universe runs to thousands of symbols; fetch it once per trading day and check membership locally, or use POST /v1/etb/search when you only care about a handful of symbols."
      operationId: "getEtbList"
      responses:
        "200":
          content:
            application/json:
              examples:
                not_loaded:
                  summary: "List not loaded yet (do not read as \"nothing is borrowable\")"
                  value:
                    count: 0
                    symbols: []
                success:
                  summary: "List loaded"
                  value:
                    count: 5
                    symbols:
                      - "A"
                      - "AA"
                      - "AAPL"
                      - "ABBRF"
                      - "ACN"
              schema:
                $ref: "#/components/schemas/EtbListResponse"
          description: "The borrowable universe currently in effect. An empty list is a valid 200: before the day's list has loaded this returns `{\"symbols\": [], \"count\": 0}` rather than an error, which means the list is not loaded yet — it must not be read as \"nothing is borrowable\". No caching headers are set; cache for the trading day and refresh after the next market open."
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "500":
          $ref: "#/components/responses/InternalServerError"
      security:
        - OAuth2:
            - "market:information"
      summary: "Get Easy-to-Borrow List"
      tags:
        - "Market Data"
      x-speakeasy-retries:
        strategy: backoff
        backoff:
          initialInterval: 500
          maxInterval: 8000
          maxElapsedTime: 60000
          exponent: 1.5
        statusCodes:
          - 429
          - 500
          - 502
          - 503
          - 504
        retryConnectionErrors: true
      x-speakeasy-group: market
  /v1/etb/search:
    post:
      description: "Answers borrowability for a batch of symbols. Use this instead of fetching the whole list when you only care about a handful — for example, deciding whether to show a short-sell option on a ticker page. This is a POST rather than a GET because a symbol list has no practical URL-length limit. Symbols are uppercased and trimmed before the lookup and duplicates collapse, so `count` can be lower than the number of symbols you sent; always read answers out of `results` by uppercase key rather than matching them against your request array by index. Reads the same underlying set as GET /v1/etb, so the two endpoints can never disagree."
      operationId: "searchEtbSymbols"
      requestBody:
        content:
          application/json:
            examples:
              duplicatesCollapse:
                summary: "Duplicates collapse to one entry keyed AAPL"
                value:
                  symbols:
                    - "aapl"
                    - " AAPL "
                    - "AAPL"
              mixedCase:
                summary: "Check three symbols (mixed case)"
                value:
                  symbols:
                    - "AAPL"
                    - "GME"
                    - "msft"
            schema:
              $ref: "#/components/schemas/EtbSearchRequest"
        description: "The symbols to check. 1–1000 entries, case-insensitive, whitespace-trimmed."
        required: true
      responses:
        "200":
          content:
            application/json:
              examples:
                duplicatesCollapse:
                  summary: "Answer for [\"aapl\", \" AAPL \", \"AAPL\"] — count is 1, not 3"
                  value:
                    count: 1
                    results:
                      AAPL: true
                mixedCase:
                  summary: "Answer for [\"AAPL\", \"GME\", \"msft\"]"
                  value:
                    count: 3
                    results:
                      AAPL: true
                      GME: false
                      MSFT: true
              schema:
                $ref: "#/components/schemas/EtbSearchResponse"
          description: "Borrowability answers keyed by normalized (uppercase) symbol. There is no 404: a symbol that is not on the list is a valid `false` answer, not a missing resource."
        "400":
          $ref: "#/components/responses/EtbSearchBadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "500":
          $ref: "#/components/responses/InternalServerError"
      security:
        - OAuth2:
            - "market:information"
      summary: "Search Easy-to-Borrow Symbols"
      tags:
        - "Market Data"
      x-speakeasy-retries:
        strategy: backoff
        backoff:
          initialInterval: 500
          maxInterval: 8000
          maxElapsedTime: 60000
          exponent: 1.5
        statusCodes:
          - 429
          - 500
          - 502
          - 503
          - 504
        retryConnectionErrors: true
