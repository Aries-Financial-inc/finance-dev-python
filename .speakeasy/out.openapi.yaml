    TickChartBars:
      description: "Tick-based chart data returned as parallel arrays, plus a pagination cursor for loading older history. Values at the same index belong to the same bar, so `t[0]`, `o[0]`, `h[0]`, `l[0]`, `c[0]`, and `v[0]` describe one candle."
      properties:
        c:
          description: "Close price for each bar. Use the value at the same index as `t` for chart candles and performance calculations."
          items:
            type: "number"
          type: "array"
        errmsg:
          description: "Human-readable error message. Present only when `s` is `error`."
          type: "string"
        h:
          description: "Highest traded price during each bar. Use it for candle wicks and intraperiod range."
          items:
            type: "number"
          type: "array"
        l:
          description: "Lowest traded price during each bar. Use it for candle wicks and intraperiod range."
          items:
            type: "number"
          type: "array"
        nextTo:
          description: "Opaque pagination token for loading the next OLDER page of bars. Save this value and send it back as the `cursor` query parameter when the user scrolls the chart further into the past. Not present when there is no older history left to load — stop requesting further pages when this field is absent."
          type: "string"
        o:
          description: "Open price for each bar. Use the value at the same index as `t` for candle bodies."
          items:
            type: "number"
          type: "array"
        s:
          description: "Response status. `ok` means chart arrays are usable; `no_data` means no matching trade activity was found; `error` means read `errmsg`."
          enum:
            - "ok"
            - "no_data"
            - "error"
          type: "string"
          x-speakeasy-unknown-values: allow
        t:
          description: "Bar timestamps in Unix MILLISECONDS (not seconds, unlike `/v1/chart/history`). Each timestamp is strictly greater than the one before it, even when many trades happen within the same second. Each timestamp index lines up with open, high, low, close, and volume arrays."
          items:
            format: "int64"
            type: "integer"
          type: "array"
        v:
          description: "Total traded volume for each bar. Use the value at the same index as `t` for volume charts."
          items:
            format: "int64"
            type: "integer"
          type: "array"
      required:
        - "s"
      type: "object"
    TickResolution:
      description: "Tick bar size: the number of trades that make up one bar. For example, `100T` closes a new bar every 100 trades, regardless of how much time that takes. Larger values (e.g. `1000T`) smooth out noise and are better suited to a wider chart view; smaller values (e.g. `1T`, one trade per bar) show every individual trade and suit a zoomed-in view."
      enum:
        - "1T"
        - "5T"
        - "10T"
        - "25T"
        - "50T"
        - "100T"
        - "250T"
        - "500T"
        - "1000T"
      example: "100T"
      type: "string"
      x-speakeasy-unknown-values: allow
    TimeInForceEnum:
      description: |-
        How long the order should stay alive before automatically cancelling. Pick one:
        - `DAY` — Active until the end of today's regular trading session, then cancelled if not filled. The default choice for most orders.
        - `GTC` — Good 'Til Cancelled. Stays open across multiple trading days until you cancel it (the broker may cap at 60–90 days).
        - `IOC` — Immediate Or Cancel. Fill whatever you can right now; cancel the rest immediately. Useful when you want partial fills but no resting order.
        - `FOK` — Fill Or Kill. Fill the entire order immediately, or cancel it entirely. No partial fills allowed.
        - `EXTENDED_HOURS` — Active during pre-market and after-hours trading sessions in addition to regular hours.
        - `AT_THE_OPENING` — Execute at the official market open price; if it can't fill at open, it's cancelled.
        - `AT_THE_CLOSE` — Execute at the official market close price; if it can't fill at close, it's cancelled.
      enum:
        - "DAY"
        - "GTC"
        - "IOC"
        - "FOK"
        - "EXTENDED_HOURS"
        - "AT_THE_OPENING"
        - "AT_THE_CLOSE"
      example: "DAY"
      type: "string"
      x-speakeasy-unknown-values: allow
    TradeOrderLegV2:
      description: "Option leg on a v2 order (`order.Leg`). Multi-leg orders carry per-leg `avgPrice`; order-level `avgPrice` is zero when `legs` is non-empty."
      properties:
        avgPrice:
          description: "Average fill price for this leg (decimal string)"
          type: "string"
        maturity:
          description: "Option expiration date in YYYY-MM-DD format. Present for option legs."
          type: "string"
        positionEffect:
          description: |-
            Whether this leg opens a new position or closes an existing one:
            - `OPEN` — opens a new position (or increases an existing one).
            - `CLOSE` — closes an existing position (or reduces it).
          enum:
            - "OPEN"
            - "CLOSE"
          type: "string"
          x-speakeasy-unknown-values: allow
        putCall:
          description: "Option contract type. CALL gives the right to buy; PUT gives the right to sell."
          enum:
            - "CALL"
            - "PUT"
          type: "string"
          x-speakeasy-unknown-values: allow
        ratioQty:
          description: "Quantity ratio for this leg, returned as a decimal string. Use it to display strategy structure."
          type: "string"
        securityType:
          description: "Instrument type for this leg. EQUITY is stock or ETF; OPTION is an options contract."
          enum:
            - "EQUITY"
            - "OPTION"
          type: "string"
          x-speakeasy-unknown-values: allow
        side:
          description: "Direction for this leg. BUY purchases the instrument; SELL sells it."
          enum:
            - "BUY"
            - "SELL"
          type: "string"
          x-speakeasy-unknown-values: allow
        strikePrice:
          description: "Option strike price as a decimal string. Present for option legs."
          type: "string"
        symbol:
          description: "Symbol for this leg. For options, use the exact contract symbol from search or the order response."
          type: "string"
      required:
        - "symbol"
        - "side"
        - "ratioQty"
        - "securityType"
        - "maturity"
        - "strikePrice"
        - "positionEffect"
        - "putCall"
      type: "object"
    TradeOrderV2:
      description: "Standard v2 order shape returned by the trading endpoints. Identical across **GET /v2/accounts/{id}/orders** (cache and DB), **GET /v2/accounts/{id}/orders/history**, and WebSocket `accUpdates` — merge live updates with REST by `clOrdId` without field remapping. Numeric quantities and prices are decimal strings. Fields marked optional in Go (`omitempty`) may be absent when empty; core quantity, price, and timestamp fields are always present on each order object."
      properties:
        accountId:
          description: "Account that owns this order."
          type: "string"
        avgPrice:
          description: "Average fill price at the order level. For multi-leg orders this may be zero; use each leg's `avgPrice` instead."
          type: "string"
        category:
          description: |-
            What kind of trade this order represents.
            - `EQUITY` — Plain stock or ETF order.
            - `SINGLE_LEG` — One option contract (call or put).
            - `MULTI_LEG` — Two-to-four-leg option strategy (spread, condor, straddle, etc.). See the `legs` array.

            Omitted when the order has not been classified.
          enum:
            - "SINGLE_LEG"
            - "MULTI_LEG"
            - "EQUITY"
          type: "string"
          x-speakeasy-unknown-values: allow
        clOrdId:
          description: "Client order ID — unique per account, used as the merge key with WebSocket order snapshots."
          type: "string"
        clientId:
          description: "OAuth client / application identifier that submitted the order. Always serialized; may be empty."
          type: "string"
        createdAt:
          description: "Time the order record was created. Use this for timeline and sorting displays."
          format: "date-time"
          type: "string"
        cumQty:
          description: "Total quantity already filled, returned as a decimal string."
          type: "string"
        currency:
          description: "Currency for prices and amounts on this order, usually USD for U.S. securities."
          type: "string"
        exDestination:
          description: |-
            Where the order was routed for execution. Useful for support diagnostics and advanced routing displays.
            - `MNGD` — Managed routing (Aries chooses the best venue automatically).
            - `MNGDFTE` — Managed routing with fill-then-end (extended) handling.
          enum:
            - "MNGD"
            - "MNGDFTE"
          example: "MNGD"
          type: "string"
          x-speakeasy-unknown-values: allow
        leavesQty:
          description: "Quantity still open and waiting to fill, returned as a decimal string."
          type: "string"
        legs:
          description: "Per-leg details for option spreads or other multi-leg orders. Empty or omitted for normal single-symbol orders."
          items:
            $ref: "#/components/schemas/TradeOrderLegV2"
          type: "array"
        ordId:
          description: "Broker order ID. Always serialized; may be an empty string for cancel-rejects or before the broker accepts the order."
          type: "string"
        ordRejReason:
          description: "Broker rejection reason code or text. Use this with `text` to explain why an order was rejected."
          type: "string"
        ordStatus:
          description: |-
            Current state of the order. Possible values:
            - `PENDING_NEW` — Submitted, waiting for exchange acknowledgement.
            - `NEW` — Accepted by the exchange and live in the order book; no fills yet.
            - `PARTIALLY_FILLED` — Some of the quantity has executed; the rest is still working. See `cumQty` and `leavesQty`.
            - `FILLED` — Fully executed. Order is complete.
            - `PENDING_CANCEL` — Cancel request submitted; waiting for exchange confirmation.
            - `CANCELED` — Order was cancelled and will not execute further.
            - `PENDING_REPLACE` — Replace/modify request submitted; waiting for exchange confirmation.
            - `REPLACED` — Order was successfully replaced/modified.
            - `REJECTED` — Order was refused (bad parameters, insufficient buying power, halted symbol, etc.). Check `ordRejReason` and `text`.
            - `EXPIRED` — Order reached its time-in-force limit without filling (e.g. a `DAY` order that didn't fill before close).
            - `DONE_FOR_DAY` — Order is no longer active for today's session but may resume on the next trading day (rare).
            - `STOPPED` — Trading was stopped on this order by an exchange action.
            - `SUSPENDED` — Order is temporarily suspended by the broker or exchange.
            - `CALCULATED` — End-of-day calculated status from FIX (rarely surfaced).
            - `ACCEPTED_FOR_BID` — Acknowledged for a bid (auction workflows).
            - `SUPERSEDED` — Replaced by a newer record; excluded from history responses server-side.

            Omitted when the broker has not yet reported a status.
          enum:
            - "NEW"
            - "PARTIALLY_FILLED"
            - "FILLED"
            - "DONE_FOR_DAY"
            - "CANCELED"
            - "REPLACED"
            - "PENDING_CANCEL"
            - "STOPPED"
            - "REJECTED"
            - "SUSPENDED"
            - "PENDING_NEW"
            - "CALCULATED"
            - "EXPIRED"
            - "ACCEPTED_FOR_BID"
            - "PENDING_REPLACE"
            - "SUPERSEDED"
          type: "string"
          x-speakeasy-unknown-values: allow
        origClOrdId:
          description: "Original client order ID for replace/cancel chains. Omitted when not part of a chain."
