    post:
      description: "**Closed beta.** Available only to accounts enrolled in the prediction-market orders closed beta. Places a prediction-market order for the authenticated user. Returns `202` as soon as the order is on its way to the venue, normally in state `pending_new`. Read the venue's answer back with Get Prediction Order."
      operationId: "placePredictionOrder"
      parameters:
        - description: "Makes a retry safe. A placement repeating a key you already used returns the order that key placed and places nothing new. The same key with different order terms returns `400` `INVALID_ORDER`. Without it, every request is a new order. Send it at most once."
          example: "7d1c8e0a-4b8f-4e3a-9f43-2a6b1d0c9e11"
          in: "header"
          name: "Idempotency-Key"
          schema:
            type: "string"
      requestBody:
        content:
          application/json:
            example:
              accountId: "ACCOUNT-0001"
              clientOrderRef: "7d1c8e0a-4b8f-4e3a-9f43-2a6b1d0c9e11"
              orderType: "limit"
              outcome: "YES"
              price: "0.54"
              quantity: "10"
              side: "buy"
              symbol: "HORC_1126_Republican"
              timeInForce: "day"
            schema:
              $ref: "#/components/schemas/PredOrdersPlaceOrderRequest"
        required: true
      responses:
        "202":
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/PredMdSuccessEnvelope"
                  - properties:
                      data:
                        $ref: "#/components/schemas/PredOrdersOrder"
                    type: "object"
          description: "Order accepted for sending. `state` is normally `pending_new`."
        "400":
          $ref: "#/components/responses/PredOrdersBadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "409":
          content:
            application/json:
              example:
                error:
                  code: "CLIENT_ORDER_REF_IN_USE"
                  message: "clientOrderRef is already used on this account"
                  type: "conflict"
                success: false
              schema:
                $ref: "#/components/schemas/PredOrdersErrorEnvelope"
          description: "`clientOrderRef` is already used on this account by a different order."
        "429":
          content:
            application/json:
              example:
                error:
                  code: "ORDER_ENTRY_AT_CAPACITY"
                  message: "order entry is at capacity; retry shortly"
                  type: "rate_limit"
                success: false
              schema:
                $ref: "#/components/schemas/PredOrdersErrorEnvelope"
          description: "Order entry is at capacity. Nothing was placed; retry shortly."
        "500":
          $ref: "#/components/responses/PredOrdersInternalServerError"
        "503":
          content:
            application/json:
              example:
                error:
                  code: "ORDER_ENTRY_UNAVAILABLE"
                  message: "order entry is not accepting orders right now"
                  type: "unavailable"
                success: false
              schema:
                $ref: "#/components/schemas/PredOrdersErrorEnvelope"
          description: "Order entry is not accepting orders (venue session down or disabled). Nothing was placed."
        "504":
          content:
            application/json:
              example:
                error:
                  code: "ORDER_OUTCOME_UNKNOWN"
                  message: "the order may have been placed; check order history, or retry with the same Idempotency-Key"
                  type: "timeout"
                success: false
              schema:
                $ref: "#/components/schemas/PredOrdersErrorEnvelope"
          description: "The call was cut short and the order may have been placed. Check order history, or retry with the same `Idempotency-Key` header — never without it."
      security:
        - OAuth2: []
      summary: "Place prediction order"
      tags:
        - "Prediction Orders"
      x-speakeasy-retries:
        strategy: backoff
        backoff:
          initialInterval: 500
          maxInterval: 8000
          maxElapsedTime: 60000
          exponent: 1.5
