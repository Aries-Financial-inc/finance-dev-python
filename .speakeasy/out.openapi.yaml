components:
  responses:
    BadRequest:
      content:
        application/json:
          examples:
            flat_string:
              summary: "Flat error string"
              value:
                error: "string"
            flat_with_codes:
              summary: "Flat error with field codes (some services)"
              value:
                codes:
                  - code: "string"
                    description: "string"
                    field: "string"
                error: "string"
            nested_bad_request:
              summary: "Nested error (BAD_REQUEST / invalid JSON)"
              value:
                error:
                  code: "INVALID_JSON"
                  message: "string"
                  type: "BAD_REQUEST"
            nested_shared_http_error:
              summary: "Nested error (typical for shared WriteHTTPError-style responses)"
              value:
                error:
                  code: "VALIDATION_ERROR"
                  details:
                    fieldName: "field is required"
                  message: "Query parameter validation failed"
                  type: "VALIDATION"
          schema:
            description: "400 responses commonly use a nested `error` object (`type`, `code`, `message`, optional `details`). Some services still return flat `ErrorResponse` (`error` string, optional `codes`)."
            oneOf:
              - $ref: "#/components/schemas/AuthenticationErrorEnvelope"
              - $ref: "#/components/schemas/ErrorResponse"
      description: |-
        Invalid query/path/body, malformed JSON, or failed validation.

        **Backend (shared HTTP errors):** Routes that use the shared error writer typically return a **nested** JSON object: `error.type` is an uppercase category such as `VALIDATION` or `BAD_REQUEST` (see the API implementation). Other routes may return the **flat** `ErrorResponse` shape (`error` as a string, optional `codes`). The body may rarely be empty.

        **OpenAPI:** Every operation’s **400** response references this component so the documented schema and examples stay aligned.
    EtbSearchBadRequest:
      content:
        application/json:
          examples:
            invalid_body:
              summary: "INVALID_BODY — malformed JSON, or body over 1 MiB"
              value:
                error:
                  code: "INVALID_BODY"
                  message: "invalid JSON body"
                  type: "BAD_REQUEST"
            missing_body:
              summary: "MISSING_BODY — empty request body"
              value:
                error:
                  code: "MISSING_BODY"
                  message: "request body required"
                  type: "BAD_REQUEST"
            missing_symbols:
              summary: "MISSING_SYMBOLS — symbols absent, empty, or every entry blank after trimming"
              value:
                error:
                  code: "MISSING_SYMBOLS"
                  message: "symbols is required and must not be empty"
                  type: "BAD_REQUEST"
            too_many_symbols:
              summary: "TOO_MANY_SYMBOLS — more than 1000 symbols"
              value:
                error:
                  code: "TOO_MANY_SYMBOLS"
                  message: "symbols exceeds the maximum of 1000 per request"
                  type: "BAD_REQUEST"
          schema:
            $ref: "#/components/schemas/AuthenticationErrorEnvelope"
      description: "The request body was missing, malformed, or unusable. Returns the nested error envelope (`error.type`, `error.code`, `error.message`)."
    Forbidden:
      content:
        application/json:
          examples:
            flat:
              summary: "Flat message"
              value:
                error: "string"
            nested:
              summary: "Nested error (shared HTTP error format)"
              value:
                error:
                  code: "INSUFFICIENT_SCOPE"
                  message: "string"
                  type: "AUTHORIZATION"
          schema:
            description: "403 responses may use a flat or nested error shape."
            oneOf:
              - $ref: "#/components/schemas/ErrorResponse"
              - $ref: "#/components/schemas/AuthenticationErrorEnvelope"
      description: |-
        Authenticated but not allowed to perform this action or access this resource (insufficient scope or role).

        **Response body variants:** Flat `ErrorResponse` or nested `error` object, same pattern as 400/401.
    GatewayTimeout:
      content:
        application/json:
          examples:
            timeout:
              summary: "Broker response timeout"
              value:
                error:
                  code: "TIMEOUT"
                  details:
                    reason: "order response timeout"
                  message: "Request timeout"
                  type: "TIMEOUT"
          schema:
            $ref: "#/components/schemas/AuthenticationErrorEnvelope"
      description: "The downstream broker did not respond in time. Returns the nested error envelope (`error.type`, `error.code`, `error.message`, optional `error.details`). The order outcome is unknown; check order status before retrying."
    InternalServerError:
      content:
        application/json:
          examples:
            flat_string:
              summary: "Flat error string"
              value:
                error: "string"
            nested_error_object:
              summary: "Nested error (shared HTTP error format)"
              value:
                error:
                  code: "INTERNAL_ERROR"
                  message: "string"
                  type: "INTERNAL"
          schema:
            description: "5xx responses may use a flat or nested error shape."
            oneOf:
              - $ref: "#/components/schemas/ErrorResponse"
              - $ref: "#/components/schemas/AuthenticationErrorEnvelope"
      description: |-
        Unexpected server error or upstream failure. **Retry with exponential backoff**; do not assume a specific JSON body shape.

        **Response body variants:** Flat `ErrorResponse`, nested `error` object, or occasionally a minimal message.
    NotFound:
      content:
        application/json:
          examples:
            flat:
              summary: "Flat message"
              value:
                error: "string"
            nested:
              summary: "Nested error (shared HTTP error format)"
              value:
                error:
                  code: "RESOURCE_NOT_FOUND"
                  message: "string"
                  type: "NOT_FOUND"
          schema:
            description: "404 responses may use a flat or nested error shape."
            oneOf:
              - $ref: "#/components/schemas/ErrorResponse"
              - $ref: "#/components/schemas/AuthenticationErrorEnvelope"
      description: |-
        The requested resource does not exist or is not visible to this caller.

        **Response body variants:** Flat `ErrorResponse` or nested `error` object.
    OrderHistoryBadRequest:
      content:
        application/json:
          examples:
            from_required:
              summary: "Missing from"
              value:
                error: "from is required"
            invalid_from:
              summary: "Malformed timestamp"
              value:
                error: "invalid from: parsing time \"2006-01-02T15:04:05Z07:00\" as \"2006-01-02T15:04:05Z07:00\": cannot parse \"\" as \"Z07:00\""
            invalid_order_by:
              summary: "Invalid sort direction"
              value:
                error: "order_by must be asc or desc"
            range_exceeded:
              summary: "Window over 90 days"
              value:
                error: "range exceeds 90 days"
          schema:
            oneOf:
              - $ref: "#/components/schemas/ErrorResponse"
              - $ref: "#/components/schemas/AuthenticationErrorEnvelope"
      description: "Bad request: missing or invalid `from`/`to`, range over 90 days, or invalid `order_by`, returned as a flat `ErrorResponse` (`error` string). Account-ID path validation failures return the nested error envelope."
    PredMdBadGateway:
      content:
        application/json:
          example:
            error:
              code: "UPSTREAM_UNAVAILABLE"
              message: "string"
              type: "EXTERNAL_SERVICE"
            success: false
          schema:
            $ref: "#/components/schemas/ErrorEnvelope"
      description: "Upstream data source failure. Response body is a prediction-market `ErrorEnvelope` with a structured `AppError`."
    PredMdBadRequest:
      content:
        application/json:
          example:
            error:
              code: "SYMBOL_REQUIRED"
              message: "string"
              type: "VALIDATION"
            success: false
          schema:
            $ref: "#/components/schemas/ErrorEnvelope"
      description: "Invalid request (validation error, malformed JSON, or missing required parameters). Response body is a prediction-market `ErrorEnvelope` with a structured `AppError`."
    PredMdInternalServerError:
      content:
        application/json:
          example:
            error:
              code: "INTERNAL_ERROR"
              message: "string"
              type: "INTERNAL"
            success: false
          schema:
            $ref: "#/components/schemas/ErrorEnvelope"
      description: "Unexpected server error. Response body is a prediction-market `ErrorEnvelope` with a structured `AppError`."
    PredMdNotFound:
      content:
        application/json:
          example:
            error:
              code: "EVENT_NOT_FOUND"
              message: "string"
              type: "NOT_FOUND"
            success: false
          schema:
            $ref: "#/components/schemas/ErrorEnvelope"
      description: "Resource not found. Response body is a prediction-market `ErrorEnvelope` with a structured `AppError`."
    PredOrdersBadRequest:
      content:
        application/json:
          example:
            error:
              code: "INVALID_ORDER"
              message: "string"
              type: "bad_request"
            success: false
          schema:
            $ref: "#/components/schemas/PredOrdersErrorEnvelope"
      description: "Invalid request. `INVALID_ORDER` carries the reason in `message`; on placement this includes refusals from order entry and the venue (price, tick size, account setup)."
    PredOrdersInternalServerError:
      content:
        application/json:
          example:
            error:
              code: "ORDER_REQUEST_FAILED"
              message: "the order request failed"
              type: "internal"
            success: false
          schema:
            $ref: "#/components/schemas/PredOrdersErrorEnvelope"
      description: "Unexpected server error."
    ServiceUnavailable:
      content:
        application/json:
          examples:
            service_unavailable:
              summary: "Dependency unavailable"
              value:
                error:
                  code: "SERVICE_UNAVAILABLE"
                  message: "Service unavailable"
                  type: "SERVICE_UNAVAILABLE"
          schema:
            $ref: "#/components/schemas/AuthenticationErrorEnvelope"
      description: "A required dependency is unavailable (for example the broker connection or a position/balance read model). Returns the nested error envelope (`error.type`, `error.code`, `error.message`, optional `error.details`)."
    Unauthorized:
      content:
        application/json:
          examples:
            flat_message:
              summary: "Flat error string (typical)"
              value:
                error: "string"
            flat_with_codes:
              summary: "Flat error with structured codes"
              value:
                codes:
                  - code: "string"
                    description: "string"
                error: "string"
            nested_error_object:
              summary: "Nested error (shared HTTP error format)"
              value:
                error:
                  code: "INVALID_TOKEN"
                  message: "string"
                  type: "AUTHENTICATION"
          schema:
            description: "401 responses may use a flat `ErrorResponse` shape or a nested `error` object. Inspect `error`: if it is a string, use the flat shape; if it is an object, use the structured shape."
            oneOf:
              - $ref: "#/components/schemas/ErrorResponse"
              - $ref: "#/components/schemas/AuthenticationErrorEnvelope"
      description: |-
        Authentication failed: missing credentials, invalid JWT, or expired access token.

        **Response body variants:** Some routes return JSON with a string `error` field (and optionally `codes` / `metadata`). Others return JSON where `error` is a structured object (`type`, `code`, `message`, and optionally `details`, `request_id`). In edge cases (for example certain gateway or middleware paths) the response may have **no body** even though the status is 401—clients should treat 401 as unauthenticated and refresh or re-authenticate regardless of body shape.
  schemas:
    AccountBalanceV2:
      description: "Response body for GET /v2/accounts/{id}/balance. Returned as the **top-level JSON object**. Numeric amounts are decimal strings."
      example:
        accountId: "TEST-ACCOUNT-001"
        amountAvailableToWithdraw: "100000"
        balance: "248874.14377781"
        cashBalance: "105000"
        costOfPositions: "180000"
        credit: "0"
        creditRemaining: "0"
        dayOpenPnl: "512.14"
        dayRealizedPnl: "37.5"
        dayTotalPnl: "549.64"
        dayTradeBuyingPower: "50000"
        dayTradeOvernightRegTBuyingPower: "48000"
        fundsAvailableForWithdrawal: "98500"
        grossMargin: "120000"
        heldBackFunds: "0"
        intradayMarginBalance: "7000"
        maintReq: "75000"
        netBuyingPower: "125000.5"
        openPnl: "836.64377781"
        optionBuyingPower: "25000"
        pdt: "0"
        pdtCreditRemaining: "0"
        pendingOrdersCount: 0
        pendingOrdersMarginRequirements: "0"
        realizedPl: "37.5"
        settledFunds: "100000"
        sma: "0"
        smaCreditRemaining: "0"
        sodFundsAvailableDate: "2026-01-14"
        sodGrossFundsAvailable: "100000"
        sodMarginTradeBalance: "-40000"
        sodNetFundsAvailable: "98500"
        sodPositionsMarketValue: "180000"
        sodTtlEquity: "248000"
        sodTtlEquityUpdatedAt: "2026-01-15T09:30:00Z"
        startOfDayCash: "95000"
        stockBuyingPower: "125000.5"
        unrealizedPl: "836.64377781"
        unsettledFunds: "5000"
        valueBought: "45000"
        valueSold: "12000"
      properties:
        accountId:
          description: "Account these balances belong to. Match it to the account selected by the user."
          type: "string"
        amountAvailableToWithdraw:
          description: "Cash currently available to withdraw from the account, returned as a decimal string."
          type: "string"
        balance:
          description: "Total account balance (net account value), returned as a decimal string. Use this as the headline portfolio value."
          type: "string"
        cashBalance:
          description: "Current cash balance in the account, returned as a decimal string. Can be negative on a margin account."
          type: "string"
        costOfPositions:
          description: "Aggregate cost basis of all currently open positions, returned as a decimal string."
          type: "string"
        credit:
          description: "Total margin credit line extended to the account. Decimal string."
          type: "string"
        creditRemaining:
          description: "How much of the credit line is still available to draw against. Decimal string."
          type: "string"
        dayOpenPnl:
          description: "Open (unrealized) profit/loss generated during the current trading day, returned as a decimal string."
          type: "string"
        dayRealizedPnl:
          description: "Profit/loss realized from positions closed during the current trading day, returned as a decimal string."
          type: "string"
        dayTotalPnl:
          description: "Total profit/loss for the current trading day, combining day open and day realized P&L (`dayOpenPnl` + `dayRealizedPnl`). Decimal string."
          type: "string"
        dayTradeBuyingPower:
          description: "How much the user can use for same-day round-trip trades. Typically up to 4× equity for pattern day traders. Resets at end of day. Decimal string."
          type: "string"
        dayTradeOvernightRegTBuyingPower:
          description: "Reg T overnight buying power available for day-trade-related calculations, returned as a decimal string."
          type: "string"
        fundsAvailableForWithdrawal:
          description: "Cash available to withdraw right now, returned as a decimal string. The lower of `creditRemaining` and `smaCreditRemaining`, adjusted by the clearing firm's previous-close haircut (`sodNetFundsAvailable` minus `sodGrossFundsAvailable`) and floored at zero. Derived at read time. Until the start-of-day funds data has loaded (see `sodFundsAvailableDate`) the haircut is zero and this equals the lower of the two credit figures."
          type: "string"
        grossMargin:
          description: "Total amount currently borrowed from the broker on margin (before offsets). Use this in risk and account-health displays. Decimal string."
          type: "string"
        heldBackFunds:
          description: "Funds reserved or held back by the brokerage, returned as a decimal string. Subtract this from available cash displays when explaining restricted funds."
          type: "string"
        intradayMarginBalance:
          description: "Margin loan currently outstanding, returned as a positive decimal string and rolled forward through today's trading: the start-of-day margin trade balance (sign-inverted) plus `valueSold` minus `valueBought`. Derived at read time, not stored."
          type: "string"
        maintReq:
          description: "**Maintenance requirement** — the minimum equity that must be held to support current positions. Drop below this and the account may receive a margin call. Decimal string."
          type: "string"
        netBuyingPower:
          description: "Total purchasing power available right now across all instruments — the main number to show as 'Buying Power' in a trading UI. Decimal string."
          type: "string"
        openPnl:
          description: "Total open (unrealized) profit/loss across all currently held positions, returned as a decimal string. Mirrors `unrealizedPl`."
          type: "string"
        optionBuyingPower:
          description: "How much the user can spend specifically on options. Usually lower than stock buying power because options require cash. Decimal string."
          type: "string"
        pdt:
          description: "**Pattern Day Trader** flag balance — relates to FINRA Rule 4210 (four-day-trades-in-five-days rule, $25,000 minimum equity). Decimal string."
          type: "string"
        pdtCreditRemaining:
          description: "Remaining day-trade buying power for a PDT-flagged account. Decimal string."
          type: "string"
        pendingOrdersCount:
          description: "Number of orders currently pending. Use this to explain why available buying power may be reserved."
          type: "integer"
        pendingOrdersMarginRequirements:
          description: "Estimated margin requirement reserved by pending orders, returned as a decimal string."
          type: "string"
        realizedPl:
          description: "Cumulative profit/loss from positions that have already been **closed**. Locked in — does not move with the market. Decimal string."
          type: "string"
        settledFunds:
          description: "Cash that has fully settled (T+1/T+2 has passed) and is freely available with no restrictions. Decimal string."
          type: "string"
        sma:
          description: "**Special Memorandum Account** — a Reg T concept. Effectively a stored-up pool of 'extra' buying power that grew from past gains in a margin account. Decimal string."
          type: "string"
        smaCreditRemaining:
          description: "Remaining SMA-based buying power still available to draw against, returned as a decimal string."
          type: "string"
        sodFundsAvailableDate:
          description: "Business date (YYYY-MM-DD) of the start-of-day funds data behind `sodGrossFundsAvailable` and `sodNetFundsAvailable`. Omitted when that data has not loaded for the account, which is the only way to tell a genuine zero from an unloaded one."
          format: "date"
          type: "string"
        sodGrossFundsAvailable:
          description: "Gross funds available at the previous close, as reported by the clearing firm, returned as a decimal string. `\"0\"` until the start-of-day load has run; check `sodFundsAvailableDate` before relying on it."
          type: "string"
        sodMarginTradeBalance:
          description: "Start-of-day margin trade-date balance as reported by the clearing firm, returned as a decimal string. Negative while a margin loan is outstanding. `\"0\"` until the start-of-day load has run for the account."
          type: "string"
        sodNetFundsAvailable:
          description: "Net funds available to withdraw at the previous close, as reported by the clearing firm, returned as a decimal string. Previous-close only; for the live figure use `fundsAvailableForWithdrawal`. `\"0\"` until the start-of-day load has run."
          type: "string"
        sodPositionsMarketValue:
          description: "Market value of positions at the start of the day, returned as a decimal string. Use this for daily performance comparisons."
          type: "string"
        sodTtlEquity:
          description: "Total account equity at the start of the day, returned as a decimal string. Use this as the baseline for day-over-day equity changes."
          type: "string"
        sodTtlEquityUpdatedAt:
          description: "When start-of-day total equity (`sodTtlEquity`) was last updated, in RFC3339 format. Omitted when not set."
          format: "date-time"
          type: "string"
        startOfDayCash:
          description: "Cash balance when today's trading session opened. Useful as the baseline for calculating today's cash change. Decimal string."
          type: "string"
        stockBuyingPower:
          description: "How much the user can spend specifically on stocks. On a margin account this is typically up to 2× cash. Decimal string."
          type: "string"
        unrealizedPl:
          description: "Profit/loss on positions the user currently **holds open** — paper gains/losses based on current market prices. Changes with the market. Decimal string."
          type: "string"
        unsettledFunds:
          description: "Cash from recent sales that hasn't settled yet. Usable for most trades, but cash accounts may restrict using it for new buys. Decimal string."
          type: "string"
        valueBought:
          description: "Total value bought for the reporting window, returned as a decimal string. Use this in trading activity summaries."
          type: "string"
        valueSold:
          description: "Total value sold for the reporting window, returned as a decimal string. Use this in trading activity summaries."
          type: "string"
      type: "object"
    AccountItem:
      description: "User account item returned by GET /v2/users/me/accounts. Use `trading_account_id` as the `tradingAccountId` in order API requests. Account type and class are empty when broker metadata is unavailable (e.g. simulation accounts)."
      properties:
        account_class:
          description: "Account class (for example MARGIN or CASH). Empty for simulation accounts or when broker metadata is unavailable."
          type: "string"
        account_type:
          description: "Account type (for example INDIVIDUAL or JOINT). Empty for simulation accounts or when broker metadata is unavailable."
          type: "string"
        broker_account_id:
          description: "Broker account identifier. Empty for simulation accounts and for accounts not yet opened with the broker."
          example: "3AF05000"
          type: "string"
        is_sim:
          description: "Whether this is a simulation (paper trading) account."
          type: "boolean"
        status:
          description: "Account status. **OPEN** = account open for trading; **SUSPENDED** = account suspended; **CLOSED** = account closed; **PENDING_APEX_VERIFICATION** = sent to Apex, awaiting verification; **CANCELED** = account canceled; **REJECTED** = application/account rejected."
          enum:
            - "NEW"
            - "PENDING_PLAID_VERIFICATION"
            - "PENDING_APEX_VERIFICATION"
            - "READY_FOR_BACK_OFFICE"
            - "BACK_OFFICE"
            - "OPEN"
            - "CANCELED"
            - "REJECTED"
            - "SUSPENDED"
            - "CLOSED"
            - "ERROR"
            - "AWAITING_REVIEW"
            - "AWAITING_APEX"
            - "RETURNED_APEX"
            - "PENDING_CLOSE"
            - "STERLING_PENDING"
          type: "string"
          x-speakeasy-unknown-values: allow
        trading_account_id:
          description: "Trading account identifier. Pass this value as `tradingAccountId` when placing, replacing, or canceling orders. Empty until the trading account has been created."
          example: "3AF05000"
          type: "string"
      required:
        - "trading_account_id"
        - "broker_account_id"
        - "status"
        - "is_sim"
        - "account_type"
        - "account_class"
      type: "object"
    AccountPosition:
      description: "One open position in the account positions list. Field names and types are stable across REST and WebSocket order updates."
      properties:
        accountId:
          description: "Account this position belongs to. Match it to the account selected by the user."
          type: "string"
        averagePrice:
          description: "Average entry price per share or contract, returned as a decimal string. This value can be used with quantity and current market price to calculate position-level profit/loss."
          type: "string"
        costBasis:
          description: "Total cost basis of the position, returned as a decimal string. Omitted when unavailable (for example, on a closed position with zero quantity)."
          type: "string"
        createdAt:
          description: "Timestamp when the current net position was established, returned in RFC3339 format. If the position is closed and reopened, this resets to the new establishment time rather than the first lot's open time. Omitted when not available."
          format: "date-time"
          type: "string"
        marketValue:
          description: "Current market value of the position (`quantity` × `price`), returned as a decimal string. Omitted when unavailable (for example, on a closed position with zero quantity)."
          type: "string"
        price:
          description: "Current market price per share or contract, returned as a decimal string. Omitted when unavailable (for example, on a closed position with zero quantity)."
          type: "string"
        quantity:
          description: "Current position quantity, returned as a decimal string. Positive values represent long positions. Negative values may represent short positions, depending on brokerage conventions."
          type: "string"
        securityType:
          description: |-
            Indicates whether the position is an equity/stock position or an option position. Use this value to decide which position details and actions should be shown in the UI.
            - `EQUITY` — a stock or ETF position.
            - `OPTION` — an option contract position.
          enum:
            - "EQUITY"
            - "OPTION"
          type: "string"
          x-speakeasy-unknown-values: allow
        symbol:
          description: "Symbol for the held instrument. Use this to link the position to quotes, charts, and research."
          type: "string"
        todayPl:
          description: "Profit or loss for the current trading day, returned as a decimal string."
          type: "string"
        todayRealizedPnL:
          description: "Profit or loss realized today from closed activity in this symbol, returned as a decimal string."
          type: "string"
        unrealizedPl:
          description: "Profit or loss on the open position at current market prices, returned as a decimal string."
          type: "string"
      type: "object"
    AggregateTechnicalIndicatorsResponse:
      description: "Aggregate technical indicator signal and trend strength for a symbol and resolution from Finnhub."
      properties:
        data:
          description: "Aggregate indicators payload."
          properties:
            technicalAnalysis:
              description: "Aggregate technical analysis summary."
              properties:
                count:
                  description: "Number of indicators giving each signal."
                  properties:
                    buy:
                      description: "Number of indicators giving a buy signal."
                      type: "integer"
                    neutral:
                      description: "Number of indicators giving a neutral signal."
                      type: "integer"
                    sell:
                      description: "Number of indicators giving a sell signal."
                      type: "integer"
                  type: "object"
                signal:
                  description: "Overall aggregate signal."
                  type: "string"
              type: "object"
            trend:
              description: "Trend strength information."
              properties:
                adx:
                  description: "Average Directional Index (ADX) value."
                  type: "number"
                trending:
                  description: "Whether the symbol is trending."
                  type: "boolean"
              type: "object"
          type: "object"
      type: "object"
    AnalystInsightItem:
      description: "Single analyst insight (GET /v1/analytics/insights)."
      example:
        action: "Upgrade"
        analystInsights: "Raised price target on stronger services revenue."
        date: "2026-01-10"
        firm: "Demo Research"
        firmId: "firm-42"
        id: "insight-001"
        pt: "210.00"
        rating: "Buy"
        ratingId: "r-8821"
        security:
          cik: "0000320193"
          exchange: "NASDAQ"
          isin: "US0378331005"
          name: "Apple Inc."
          symbol: "AAPL"
        updated: 1736534400
      properties:
        action:
          description: "Analyst action such as upgrade, downgrade, initiation, or reiteration. Use it to explain what changed."
          type: "string"
