  /v1/market/holiday:
    get:
      description: "Retrieve market holiday schedules showing dates when exchanges are closed for official holidays and early close days."
      operationId: "getMarketHolidays"
      parameters:
        - description: "exchange code (case-insensitive). Select from the Try it dropdown or use any value from the supported exchange list in the API reference page."
          in: "query"
          name: "exchange"
          required: true
          schema:
            $ref: "#/components/schemas/ExchangeCode"
      responses:
        "200":
          content:
            application/json:
              examples:
                default:
                  value:
                    holidays:
                      - atDate: "2026-12-25"
                        eventName: "Christmas Day"
                        tradingHour: ""
                      - atDate: "2026-12-24"
                        eventName: "Christmas Day"
                        tradingHour: "09:30-13:00"
              schema:
                $ref: "#/components/schemas/MarketHolidayResponse"
          description: "Successful response"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalServerError"
      security:
        - OAuth2:
            - "market:supplemental"
      summary: "Get Market Holidays"
      tags:
        - "Market"
      x-speakeasy-retries:
        strategy: backoff
        backoff:
          initialInterval: 500
          maxInterval: 8000
          maxElapsedTime: 60000
          exponent: 1.5
        statusCodes:
          - 429
          - 500
          - 502
          - 503
          - 504
        retryConnectionErrors: true
      x-speakeasy-group: market
      x-speakeasy-name-override: get_holidays
  /v1/market/status:
    get:
      description: "Retrieve current market status indicating whether exchanges are open, closed, or in pre-market/after-hours trading sessions. Returns 400 when `exchange` is not a supported Finnhub exchange code; the error message lists the supported codes."
      operationId: "getMarketStatus"
      parameters:
        - description: "exchange code (case-insensitive). Select from the Try it dropdown or use any value from the supported exchange list in the API reference page."
          in: "query"
          name: "exchange"
          required: true
          schema:
            $ref: "#/components/schemas/ExchangeCode"
      responses:
        "200":
          content:
            application/json:
              examples:
                default:
                  value:
                    exchange: "US"
                    isOpen: false
                    session: ""
                    timestamp: 1765526940
                    timezone: "America/New_York"
              schema:
                $ref: "#/components/schemas/MarketStatus"
          description: "Successful response"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
