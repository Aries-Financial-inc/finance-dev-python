    get:
      description: "Search for company logos and brand assets by ticker symbol or company name for use in financial applications and dashboards."
      operationId: "searchLogos"
      parameters:
        - description: "One or more values to look up, comma-separated. The format depends on `searchKeysType`. For example, with `searchKeysType=symbol` send `AAPL,MSFT`; with `searchKeysType=cik` send `0000320193,0000789019`."
          in: "query"
          name: "searchKeys"
          required: true
          schema:
            example: "AAPL,MSFT"
            type: "string"
        - description: |-
            Tells the API how to interpret the value you send in `searchKeys`. Allowed values:
            - `firm_id` — the value is a firm/company internal ID.
            - `firm` — the value is the firm/company name.
          in: "query"
          name: "searchKeysType"
          schema:
            enum:
              - "symbol"
              - "cik"
              - "cusip"
              - "isin"
            example: "symbol"
            type: "string"
            x-speakeasy-unknown-values: allow
        - description: |-
            Comma-separated list of logo asset fields to return. Common values:
            - `logo_light` — full logo for light backgrounds.
            - `logo_dark` — full logo for dark backgrounds.
            - `mark_light` — square/icon mark for light backgrounds.
            - `mark_dark` — square/icon mark for dark backgrounds.

            Other provider-defined fields may also be supported — pass any field name the upstream image catalog exposes.
          in: "query"
          name: "fields"
          required: true
          schema:
            example: "logo_light,logo_dark,mark_light,mark_dark"
            type: "string"
        - description: "Whether to auto-generate composite logo marks. Use true when you need fallback visuals for symbols without a standard logo."
          in: "query"
