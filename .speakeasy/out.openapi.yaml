  /v1/indicator:
    get:
      description: |-
        Retrieve calculated technical indicator values including SMA, EMA, RSI, MACD, Bollinger Bands, and other charting indicators.

        If `from` or `to` cannot be parsed as a signed 64-bit integer, returns 400 Bad Request with error code `INVALID_PARAMETER` and message `invalid from parameter` or `invalid to parameter`. Invalid indicator requests rejected by the data provider return 400 Bad Request with error code `BAD_REQUEST`; the message includes provider error details when suitable for public responses, otherwise `Invalid request parameters.`.
      operationId: "getTechnicalIndicator"
      parameters:
        - description: "Stock ticker to query. Send the plain uppercase symbol exactly as you'd type it on a brokerage screen, e.g. `AAPL`, `MSFT`, `TSLA`."
          in: "query"
          name: "symbol"
          required: true
          schema:
            type: "string"
        - description: "How long each bar covers. Supported values are minutes (`1`, `5`, `15`, `30`, `60`) or daily/weekly/monthly (`D`, `W`, `M`). Other values return 400 Bad Request with error code `VALIDATION_ERROR`."
          in: "query"
          name: "resolution"
          required: true
          schema:
            enum:
              - "1"
              - "5"
              - "15"
              - "30"
              - "60"
              - "D"
              - "W"
              - "M"
            type: "string"
            x-speakeasy-unknown-values: allow
        - description: "Which technical indicator to compute. Common picks: `sma` (simple moving average), `ema` (exponential moving average), `rsi` (relative strength index), `macd` (moving-average convergence-divergence), `bbands` (Bollinger Bands). See `TechnicalIndicatorType` for the full list of supported slugs."
          in: "query"
          name: "indicator"
          required: true
          schema:
            $ref: "#/components/schemas/TechnicalIndicatorType"
        - description: "Start timestamp (Unix seconds)"
          in: "query"
          name: "from"
          required: true
          schema:
            format: "int64"
            type: "integer"
        - description: "End timestamp (Unix seconds)"
          in: "query"
          name: "to"
          required: true
          schema:
            format: "int64"
            type: "integer"
        - description: "(Optional) Period for SMA/RSI/BBANDS"
          in: "query"
          name: "timeperiod"
          schema:
            type: "integer"
        - description: "MACD fast EMA length, in bars. The shorter of the two moving averages used to compute MACD. Standard value is 12. Only used when `indicator=macd`."
          in: "query"
          name: "fast_period"
          schema:
            type: "integer"
        - description: "MACD slow EMA length, in bars. The longer of the two moving averages used to compute MACD. Standard value is 26. Only used when `indicator=macd`."
          in: "query"
          name: "slow_period"
          schema:
            type: "integer"
        - description: "MACD signal EMA length, in bars. Used to smooth the MACD line into the signal line; crossovers between the two are the basic MACD trading cue. Standard value is 9. Only used when `indicator=macd`."
          in: "query"
          name: "signal_period"
          schema:
            type: "integer"
      responses:
