          in: "query"
          name: "identifierType"
          schema:
            $ref: "#/components/schemas/IndicesIdentifierType"
        - description: "End time for the bar window. Format: `MM/DD/YYYY hh:mm am/pm` in the index's native timezone (e.g. `12/22/2025 10:30 am`)."
