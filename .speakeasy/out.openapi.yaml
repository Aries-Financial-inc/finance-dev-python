  /v1/chart/tick-history:
    get:
      description: "Retrieves tick-based chart bars for a specific symbol. Unlike time-based candles (which close every fixed number of minutes, hours, or days), a tick bar closes every time a fixed number of trades has occurred — for example, a `100T` bar closes after every 100 trades, whether that takes two seconds in a busy market or two minutes in a quiet one. This makes tick charts useful for visualizing market *activity* rather than the *passage of time*, which many traders use to spot momentum and unusual volume. Tick resolutions cannot be derived from time-based bars, so they are served from this dedicated endpoint rather than `/v1/chart/history`. Bar timestamps are returned in Unix milliseconds and are always strictly increasing, even for very actively traded symbols. Because tick bars are built from live trade activity rather than fixed calendar periods, older bars are loaded using the `cursor` pagination token instead of a date range — see the `cursor` and `nextTo` fields below."
      operationId: "getTickHistory"
      parameters:
        - description: "Symbol to fetch tick bars for. Use the exact symbol returned by symbol search, such as `AAPL` for equities."
          example: "AAPL"
          in: "query"
          name: "symbol"
          required: true
          schema:
            type: "string"
        - description: "Tick bar size: the number of trades that make up one bar."
          example: "100T"
          in: "query"
          name: "resolution"
          required: true
          schema:
            $ref: "#/components/schemas/TickResolution"
        - description: "How many bars to return, counting back from the most recent bar (or from `cursor`, if provided). Defaults to 300 when omitted. The maximum depends on `resolution`: each call is bounded by a fixed per-request trade budget, so low-count ticks (e.g. `1T`) can return up to 5000 bars, while high-count ticks (e.g. `1000T`) may cap out around 50. Requests above the resolution's maximum are silently reduced to it — this is normal, not an error. Use the `cursor` field to keep loading further back until you have as much history as you need."
          example: 300
          in: "query"
          name: "countback"
          schema:
            default: 300
            minimum: 1
            type: "integer"
        - description: "Pagination token for loading OLDER bars, used when a user scrolls a chart backward in time. Omit this parameter for the initial chart load, which returns the most recent bars. To load the page before that, pass the `nextTo` value from the previous response as `cursor`. Treat this value as opaque — always pass it back exactly as received; do not attempt to construct, decode, or modify it."
          example: "1784677563966606471"
          in: "query"
          name: "cursor"
          schema:
            type: "string"
      responses:
        "200":
          content:
            application/json:
              examples:
                success:
                  value:
                    c:
                      - 130.15
                      - 130.89
                      - 131.24
                    h:
                      - 130.28
                      - 131.05
                      - 131.37
                    l:
                      - 129.88
                      - 130.09
                      - 130.81
                    nextTo: "1784677563966606471"
                    o:
                      - 129.93
                      - 130.15
                      - 130.89
                    s: "ok"
                    t:
                      - 1784677561000
                      - 1784677562500
                      - 1784677563966
                    v:
                      - 1234567
                      - 1345678
                      - 1456789
              schema:
                $ref: "#/components/schemas/TickChartBars"
          description: "Tick bars in TradingView UDF format, extended with a pagination cursor. Always returns 200; check **s** (status): `ok` = data in t, o, h, l, c, v (and usually `nextTo`); `no_data` = no matching trade activity, and `nextTo` will be absent — stop requesting further history; `error` = errmsg contains reason (e.g. invalid resolution or malformed cursor)."
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalServerError"
      security:
        - OAuth2:
            - "market:information"
      summary: "Get Tick-Based Chart Data"
      tags:
