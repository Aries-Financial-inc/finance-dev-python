  /v1/predictions/search:
    get:
      description: "Full-text search over one index of event contracts. Filters always apply to contracts, so with type=events or type=base-events an event or base event is found through its matching contracts: one with none (for example, only DELETED contracts under the default state) is not returned. The index trails the catalogue by seconds."
      operationId: "search"
      parameters:
        - description: "Level hits come back at. `contracts` (default) returns matching contracts; `events` returns one hit per event and `base-events` one per base event, each ranked by its best-matching contract and carrying only its own fields and a count of matching contracts. Echoed in the response."
          in: "query"
          name: "type"
          required: false
          schema:
            default: "contracts"
            enum:
              - "contracts"
              - "events"
              - "base-events"
            type: "string"
            x-speakeasy-unknown-values: allow
        - description: "Full-text query over symbols, questions, event names and base-event specifications. Symbols split on _, - and . so `BPM 0822` finds `BPM_0822_1750`. Omit to browse, soonest last-trade date first."
          in: "query"
          name: "q"
          required: false
          schema:
            example: "unemployment june"
            type: "string"
        - description: "Contract state. Omitted means ACTIVE; `*` matches every state, including DELETED."
          in: "query"
          name: "state"
          required: false
          schema:
            example: "ACTIVE"
            type: "string"
        - description: "Only contracts under this base event."
          in: "query"
          name: "baseEventId"
          required: false
          schema:
            example: "UNR"
            type: "string"
        - description: "Only contracts under this event."
          in: "query"
          name: "eventId"
          required: false
          schema:
            example: "UNR_0822"
            type: "string"
        - description: "Only contracts in this category or any category under it. Takes a `path` from List Categories, URL-encoded. A bare level name such as `United States` matches nothing, because level names repeat under different parents."
          in: "query"
          name: "category"
          required: false
          schema:
            example: "Elections > United States House"
            type: "string"
        - description: "Only tradable (true) or non-tradable (false) contracts."
          in: "query"
          name: "tradable"
          required: false
          schema:
            type: "boolean"
        - description: "1-based page number; 0 or omitted means 1."
          in: "query"
          name: "page"
          required: false
          schema:
            example: 1
            minimum: 0
            type: "integer"
        - description: "Hits per page, counting whatever type returns; 0 or omitted means 20, values above 100 are clamped to 100."
          in: "query"
          name: "perPage"
          required: false
          schema:
            example: 20
            maximum: 100
            minimum: 0
            type: "integer"
      responses:
        "200":
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/PredMdSuccessEnvelope"
                  - properties:
                      data:
                        discriminator:
                          mapping:
                            base-events: "#/components/schemas/PredMdBaseEventSearchResult"
                            contracts: "#/components/schemas/PredMdContractSearchResult"
                            events: "#/components/schemas/PredMdEventSearchResult"
                          propertyName: "type"
                        oneOf:
                          - $ref: "#/components/schemas/PredMdContractSearchResult"
                          - $ref: "#/components/schemas/PredMdEventSearchResult"
                          - $ref: "#/components/schemas/PredMdBaseEventSearchResult"
                    type: "object"
          description: "One page of hits; data.type says which shape they are"
        "400":
          $ref: "#/components/responses/PredMdBadRequest"
        "502":
          $ref: "#/components/responses/PredMdBadGateway"
      security: []
      summary: "Search contracts, events or base events"
      tags:
        - "Prediction Market Data"
      x-speakeasy-retries:
        strategy: backoff
        backoff:
          initialInterval: 500
          maxInterval: 8000
          maxElapsedTime: 60000
          exponent: 1.5
        statusCodes:
          - 429
          - 500
          - 502
          - 503
          - 504
        retryConnectionErrors: true
      x-speakeasy-pagination:
        type: offsetLimit
        inputs:
          - name: page
            in: parameters
            type: page
          - name: perPage
            in: parameters
            type: limit
        outputs:
          results: $.data.hits
      x-speakeasy-group: predictions.markets
