  /v2/accounts/{id}/orders:
    get:
      description: |-
        Returns active orders (open orders plus today's terminal activity) from the orders v2 cache only. There is no database fallback.

        Pagination uses an opaque int64 cursor: omit cursor or send 0 for the first page, then send nextCursor; 0 means exhausted. Each order uses the same domain shape as WebSocket account updates.
      operationId: "listActiveOrders"
      parameters:
        - description: "Account ID whose active orders you want to read. Use the account identifier from the user's account list or trading setup."
          example: "TEST-ACCOUNT-001"
          in: "path"
          name: "id"
          required: true
          schema:
            type: "string"
        - description: "Maximum number of orders to return in this page. Use smaller values for UI lists and larger values for back-office exports. Default is 50; maximum is 500."
          example: 50
          in: "query"
          name: "limit"
          schema:
            default: 50
            maximum: 500
            minimum: 1
            type: "integer"
        - description: "Opaque pagination cursor. Send `0` (or omit) for the first page; pass the previous response's `nextCursor` for subsequent pages. Stop when `nextCursor` is `0`."
          example: 0
          in: "query"
          name: "cursor"
          schema:
            default: 0
            format: "int64"
            type: "integer"
      responses:
        "200":
          content:
            application/json:
              example:
                nextCursor: 0
                orders:
                  - accountId: "TEST-ACCOUNT-001"
                    avgPrice: "0"
                    category: "SINGLE_LEG"
                    clOrdId: "clord-20260115-aapl-001"
                    clientId: "demo-oauth-client"
                    createdAt: "2026-01-15T14:30:00Z"
                    cumQty: "0"
                    currency: "USD"
                    exDestination: "MNGD"
                    leavesQty: "100"
                    legs: []
                    ordId: "ord-7f3a9c2e-0001"
                    ordRejReason: ""
                    ordStatus: "NEW"
                    price: "175.50"
                    qty: "100"
                    securityType: "EQUITY"
                    side: "BUY"
                    stopPrice: ""
                    symbol: "AAPL"
                    text: ""
                    timeInForce: "DAY"
                    type: "LIMIT"
                    updatedAt: "2026-01-15T14:30:05Z"
              schema:
                $ref: "#/components/schemas/GetOrdersV2Response"
          description: "Page of active orders"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalServerError"
      security:
        - OAuth2:
            - "order:information"
      summary: "List active orders (v2)"
      tags:
        - "Orders"
      x-speakeasy-retries:
        strategy: backoff
        backoff:
          initialInterval: 500
          maxInterval: 8000
          maxElapsedTime: 60000
          exponent: 1.5
        statusCodes:
          - 429
          - 500
          - 502
          - 503
          - 504
        retryConnectionErrors: true
      x-speakeasy-pagination:
        type: cursor
        inputs:
          - name: cursor
            in: parameters
            type: cursor
          - name: limit
            in: parameters
            type: limit
        outputs:
          nextCursor: $.nextCursor
          results: $.orders
      x-speakeasy-group: orders
  /v2/accounts/{id}/orders/history:
    get:
      description: |-
        Date-range query against **PostgreSQL** only (no `source` parameter). `from` is required; `to` defaults to the current time truncated to the minute (UTC). The server caps the window at **90 days**.

        Results are ordered and filtered by `order_created_at` (keyset pagination uses the row `id` for correctness). Rows with `SUPERSEDED` status and rows with `failed_flag = true` are excluded.

        Set `exclude_today=true` to narrow `to` to just before midnight **America/New_York**, omitting today's activity (already returned by **GET /v2/accounts/{id}/orders**).

        **Pagination:** Same opaque `int64` cursor contract as active orders when reading from DB — `cursor=0` first, then `nextCursor`; `0` means exhausted.
      operationId: "listOrderHistory"
      parameters:
        - description: "Account ID whose historical orders you want to read."
          example: "TEST-ACCOUNT-001"
          in: "path"
          name: "id"
          required: true
          schema:
            type: "string"
        - description: "Start of the history window, inclusive. Enter an RFC 3339 timestamp with timezone, for example `2026-04-01T00:00:00Z`."
          example: "2026-01-01T00:00:00Z"
          in: "query"
          name: "from"
          required: true
          schema:
            format: "date-time"
            type: "string"
        - description: "End of the history window, inclusive. Omit it to use the current time. The total range from `from` cannot exceed 90 days."
          example: "2026-01-31T00:00:00Z"
          in: "query"
          name: "to"
          schema:
            format: "date-time"
            type: "string"
        - description: "Sort direction by `order_created_at`. Defaults to `desc` (newest first). Use `asc` for chronological exports."
          example: "desc"
          in: "query"
          name: "order_by"
          schema:
            default: "desc"
            enum:
              - "asc"
              - "desc"
            type: "string"
            x-speakeasy-unknown-values: allow
        - description: "Set to `true` when you want historical orders only and do not want today's activity duplicated with the active-orders endpoint."
          example: false
          in: "query"
          name: "exclude_today"
          schema:
            default: false
            type: "boolean"
        - description: "Maximum number of historical orders to return in this page. Default is 50; maximum is 500."
          example: 50
          in: "query"
          name: "limit"
          schema:
            default: 50
            maximum: 500
            minimum: 1
            type: "integer"
        - description: "Opaque pagination cursor for the database history walk. Send `0` (or omit) for the first page; pass the previous `nextCursor` until it returns `0`."
          example: 0
          in: "query"
          name: "cursor"
          schema:
            default: 0
            format: "int64"
            type: "integer"
      responses:
        "200":
          content:
            application/json:
              example:
                nextCursor: 0
                orders:
                  - accountId: "TEST-ACCOUNT-001"
                    avgPrice: "410.25"
                    category: "SINGLE_LEG"
                    clOrdId: "clord-20260310-msft-001"
                    clientId: "demo-oauth-client"
                    createdAt: "2026-03-10T15:00:00Z"
                    cumQty: "10"
                    currency: "USD"
                    exDestination: "MNGD"
                    leavesQty: "0"
                    legs: []
                    ordId: "ord-hist-0001"
                    ordRejReason: ""
                    ordStatus: "FILLED"
                    price: "410.00"
                    qty: "10"
                    securityType: "EQUITY"
                    side: "SELL"
                    stopPrice: ""
                    symbol: "MSFT"
                    text: ""
                    timeInForce: "DAY"
                    type: "LIMIT"
                    updatedAt: "2026-03-10T15:00:12Z"
              schema:
                $ref: "#/components/schemas/GetOrdersV2Response"
          description: "Page of historical orders"
        "400":
          $ref: "#/components/responses/OrderHistoryBadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalServerError"
      security:
        - OAuth2:
            - "order:information"
      summary: "List order history (v2)"
      tags:
        - "Orders"
      x-speakeasy-retries:
        strategy: backoff
        backoff:
          initialInterval: 500
          maxInterval: 8000
          maxElapsedTime: 60000
          exponent: 1.5
        statusCodes:
          - 429
          - 500
          - 502
          - 503
          - 504
        retryConnectionErrors: true
      x-speakeasy-pagination:
        type: cursor
        inputs:
          - name: cursor
            in: parameters
            type: cursor
          - name: limit
            in: parameters
            type: limit
        outputs:
          nextCursor: $.nextCursor
          results: $.orders
      x-speakeasy-group: orders
