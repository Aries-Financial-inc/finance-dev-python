                      - 1583193600
                      - 1583280000
                      - 1583366400
                      - 1583452800
                      - 1583712000
                      - 1583798400
                      - 1583884800
                      - 1583971200
                      - 1584057600
              schema:
                $ref: "#/components/schemas/TechnicalIndicatorResponse"
          description: "Successful response"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
