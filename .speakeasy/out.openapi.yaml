  /v1/orders/replace:
    post:
      description: |-
        Replace/modify an existing order (change quantity, price, or time in force). **ID cycling:** a successful replace returns a new `clOrdId`. Use that new ID as `origClOrdId` for any further replaces of this order — the previous ID is no longer valid once replaced.

        For single-leg options, you can send the option fields directly, put them inside the single leg, or send an OSI option symbol in `symbol` and let the backend derive the instrument. Multi-leg replaces must pass `legs` explicitly.

        Price precision validation:
        - `LIMIT` validates `price`
        - `STOP` validates `stopPrice`
        - `STOP_LIMIT` validates both
        - Decimal inputs support up to 5 digits after the decimal point.
      operationId: "replaceOrder"
      requestBody:
        content:
          application/json:
            examples:
              changePrice:
                summary: "Change Price"
                value:
                  origClOrdId: "ORDER-123456"
                  price: "148.50"
                  qty: "10"
                  side: "BUY"
                  symbol: "AAPL"
                  timeInForce: "DAY"
                  tradingAccountId: "TEST-ACCOUNT-001"
                  type: "LIMIT"
              changeQuantity:
                summary: "Change Quantity"
                value:
                  origClOrdId: "ORDER-123456"
                  price: "150.00"
                  qty: "20"
                  side: "BUY"
                  symbol: "AAPL"
                  timeInForce: "DAY"
                  tradingAccountId: "TEST-ACCOUNT-001"
                  type: "LIMIT"
            schema:
              $ref: "#/components/schemas/ReplaceOrdRequest"
        description: "Which order to modify and what to change. Required: `origClOrdId`, at least one of `accountId` or `tradingAccountId`, `symbol`. Then include only the fields you want to update — typically some combination of `qty`, `price`, `stopPrice`, `type`, and `timeInForce`."
        required: true
      responses:
        "200":
          content:
            application/json:
              example:
                clOrdId: "ORDER-20260115-003"
                origClOrdId: "ORDER-20260115-001"
                price: "175.50"
                qty: "200"
                status: "REPLACED"
                success: true
                text: "Replace accepted"
                transactTime: "2026-01-15T14:31:00Z"
              schema:
                $ref: "#/components/schemas/ReplaceOrdResponse"
          description: "Replace request submitted successfully"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalServerError"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"
        "504":
          $ref: "#/components/responses/GatewayTimeout"
      security:
        - OAuth2:
            - "order:execution"
      summary: "Replace an order"
      tags:
        - "Orders"
      x-speakeasy-group: orders
      x-speakeasy-name-override: replace
