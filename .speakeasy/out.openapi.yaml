                  type: "string"
                aum:
                  description: "Assets under management of the ETF."
                  type: "integer"
                avgVolume:
                  description: "Average trading volume of the ETF."
                  type: "integer"
                cusip:
                  description: "CUSIP identifier of the ETF."
                  type: "string"
                description:
                  description: "Text description of the ETF."
                  type: "string"
                domicile:
                  description: "Domicile of the ETF."
                  type: "string"
                etfCompany:
                  description: "Company that manages or issues the ETF."
                  type: "string"
                expenseRatio:
                  description: "Expense ratio of the ETF."
                  type: "number"
                inceptionDate:
                  description: "Inception date of the ETF as a string from the provider."
                  type: "string"
                investmentSegment:
                  description: "Investment segment of the ETF."
                  type: "string"
                isin:
                  description: "ISIN identifier of the ETF."
                  type: "string"
                logo:
                  description: "URL of the ETF logo image."
                  type: "string"
                name:
                  description: "Name of the ETF."
                  type: "string"
                nav:
                  description: "Net asset value of the ETF."
                  type: "number"
                navCurrency:
                  description: "Currency in which the net asset value is quoted."
                  type: "string"
                priceToBook:
