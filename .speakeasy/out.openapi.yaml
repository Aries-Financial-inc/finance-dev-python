                example: "IND_CBOM"
                type: "string"
              indexName:
                description: "Index name"
                example: "S&P 500"
                type: "string"
              symbol:
                description: "Index symbol identifier"
                example: "SPX"
                type: "string"
            type: "object"
          type: "array"
        nextPage:
          description: "Token for the next page. Send it as `nextPage` on the next request. Omitted on the last page."
          example: "AFEFB09147DA3C09B6A280B0A807F239"
          type: "string"
      type: "object"
