      operationId: "getConfigWatchlists"
      responses:
        "200":
          content:
            application/json:
              examples:
                watchlists:
                  summary: "User with two watchlists"
                  value:
                    user_id: 98765
                    watchlist:
                      - id: 12345
                        name: "Tech Stocks"
                        symbols:
                          - "AAPL"
                          - "GOOGL"
                          - "MSFT"
                      - id: 12346
                        name: "Finance"
                        symbols:
                          - "JPM"
                          - "BAC"
                          - "GS"
              schema:
                $ref: "#/components/schemas/WatchlistResponse"
          description: "The authenticated user's watchlists."
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "500":
          $ref: "#/components/responses/InternalServerError"
      security:
        - OAuth2:
            - "watchlist:information"
