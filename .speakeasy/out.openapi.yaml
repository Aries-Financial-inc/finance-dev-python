  /v1/orders:
    post:
      description: |-
        Place an equity or option order. The order type is automatically determined:
        - No `legs` array = Equity order
        - 1 leg in `legs` array = Single-leg option order
        - 2-4 legs in `legs` array = Multi-leg option order

        Option and multi-leg orders only support `DAY` and `GTC` for `timeInForce`.

        If you send an OSI option symbol in `symbol` and omit `legs`, the backend derives a single option leg automatically.

        Price precision validation:
        - `LIMIT` validates `price`
        - `STOP` validates `stopPrice`
        - `STOP_LIMIT` validates both
        - Decimal inputs support up to 5 digits after the decimal point.
      operationId: "placeOrder"
      requestBody:
        content:
          application/json:
            examples:
              equityLimit:
                summary: "Equity Limit Order"
                value:
                  price: "150.00"
                  qty: "10"
                  side: "BUY"
                  symbol: "AAPL"
                  timeInForce: "DAY"
                  tradingAccountId: "TEST-ACCOUNT-001"
                  type: "LIMIT"
              equityMarket:
                summary: "Equity Market Order"
                value:
                  qty: "10"
                  side: "BUY"
                  symbol: "AAPL"
                  timeInForce: "DAY"
                  tradingAccountId: "TEST-ACCOUNT-001"
                  type: "MARKET"
              singleLegCall:
                summary: "Single-Leg Call Option"
                value:
                  legs:
                    - maturity: "2025-01-17"
                      positionEffect: "OPEN"
                      putCall: "CALL"
                      ratioQty: "1"
                      securityType: "OPT"
                      side: "BUY"
                      strikePrice: "150.00"
                  price: "5.50"
                  qty: "1"
                  side: "BUY"
                  symbol: "AAPL"
                  timeInForce: "DAY"
                  tradingAccountId: "TEST-ACCOUNT-001"
                  type: "LIMIT"
              verticalSpread:
                summary: "Multi-Leg Vertical Spread"
                value:
                  legs:
                    - maturity: "2025-01-17"
                      positionEffect: "OPEN"
                      putCall: "CALL"
                      ratioQty: "1"
                      securityType: "OPT"
                      side: "BUY"
                      strikePrice: "150.00"
                    - maturity: "2025-01-17"
                      positionEffect: "OPEN"
                      putCall: "CALL"
                      ratioQty: "1"
                      securityType: "OPT"
                      side: "SELL"
                      strikePrice: "155.00"
                  price: "2.50"
                  qty: "1"
                  side: "BUY"
                  symbol: "AAPL"
                  timeInForce: "DAY"
                  tradingAccountId: "TEST-ACCOUNT-001"
                  type: "LIMIT"
            schema:
              $ref: "#/components/schemas/PlaceOrdRequest"
        description: "The order to place. Required: at least one of `accountId` or `tradingAccountId`, `symbol`, `side`, `type`, `qty`, `timeInForce`. Add `price` for limit-style orders, `stopPrice` for stop-style orders, and `legs` for option orders. You may also send an OSI option symbol in `symbol` without `legs` and let the backend derive the option instrument."
        required: true
      responses:
        "200":
          content:
            application/json:
              example:
                avgPrice: "0"
                clOrdId: "ORDER-20260115-001"
                cumQty: "0"
                leavesQty: "10"
                ordRejReason: ""
                qty: "10"
                side: "BUY"
                status: "NEW"
                success: true
                symbol: "AAPL"
                text: "Order accepted"
                transactTime: "2026-01-15T14:30:05Z"
              schema:
                $ref: "#/components/schemas/OrdResponse"
          description: "Order placed successfully"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalServerError"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"
        "504":
          $ref: "#/components/responses/GatewayTimeout"
      security:
        - OAuth2:
            - "order:execution"
      summary: "Place an order"
      tags:
        - "Orders"
      x-speakeasy-group: orders
