        tradingSchedule:
          description: "Venue JSON payload (passthrough)."
      required:
        - "symbol"
        - "eventId"
        - "baseEventId"
        - "state"
        - "tradable"
        - "nonTradable"
        - "lastSyncedAt"
        - "tickSize"
        - "symbolSubTypes"
      type: "object"
    PredMdContractHit:
      description: "One matching contract, with its event's and base event's text flattened in. The index trails the catalogue by seconds; read the contract through /events/{eventId}/contracts when it must be current."
      properties:
        baseEventId:
          type: "string"
        evaluationType:
          type: "string"
        eventDisplayName:
          type: "string"
        eventId:
          type: "string"
        eventQuestion:
          type: "string"
        expirationDate:
          description: "Calendar date, at midnight UTC."
          format: "date-time"
          nullable: true
          type: "string"
        lastTradeDate:
          description: "Calendar date, at midnight UTC."
          format: "date-time"
          nullable: true
          type: "string"
        question:
          type: "string"
        startDate:
          description: "Calendar date, at midnight UTC."
          format: "date-time"
          nullable: true
          type: "string"
        state:
          example: "ACTIVE"
          type: "string"
        strikeValue:
          type: "string"
        symbol:
          example: "UNR_0822_3.5"
          type: "string"
        symbolSubTypes:
          items:
            type: "string"
          type: "array"
        tickSize:
          description: "Exact decimal, serialized as a string so no client parses it through a float."
          example: "0.01"
          format: "decimal"
          type: "string"
        timeSpecifier:
          description: "Published precision: YYYY, YYYY.MM or YYYY.MM.DD."
          example: "2022.08"
          type: "string"
        tradable:
          type: "boolean"
        underlyingSpec:
          type: "string"
      required:
        - "symbol"
        - "eventId"
        - "baseEventId"
        - "symbolSubTypes"
        - "state"
        - "tradable"
        - "tickSize"
      type: "object"
    PredMdContractSearchResult:
      description: "One page of contracts."
      properties:
        found:
          description: "Every match, not just this page."
          minimum: 0
          type: "integer"
        hits:
          items:
            $ref: "#/components/schemas/PredMdContractHit"
          type: "array"
        page:
          minimum: 1
          type: "integer"
        perPage:
          maximum: 100
          minimum: 1
          type: "integer"
        type:
          enum:
            - "contracts"
          type: "string"
      required:
        - "type"
        - "hits"
        - "found"
        - "page"
        - "perPage"
      type: "object"
    PredMdEvent:
      description: "One real-world event under a base event (e.g. HORC_1126)."
      properties:
        baseEventId:
          type: "string"
        calculationMethod:
          type: "string"
        eventDisplayName:
          type: "string"
        eventId:
          type: "string"
        eventQuestion:
          type: "string"
        expectedLastTradeTime:
          description: "Venue wall-clock time; the feed carries no zone, so the Z is a label, not a conversion."
          format: "date-time"
          nullable: true
          type: "string"
        expectedPayoutTime:
          description: "Venue wall-clock time; the feed carries no zone, so the Z is a label, not a conversion."
          format: "date-time"
          nullable: true
          type: "string"
        expectedResolutionTime:
          description: "Venue wall-clock time; the feed carries no zone, so the Z is a label, not a conversion."
          format: "date-time"
          nullable: true
          type: "string"
        lastSyncedAt:
          format: "date-time"
          type: "string"
        sourceAgency:
          type: "string"
        sourceAgencyUrl:
          type: "string"
        timeSpecifier:
          description: "Published precision: YYYY, YYYY.MM or YYYY.MM.DD."
          example: "2026.06"
          type: "string"
        underlyingSpec:
          type: "string"
      required:
        - "eventId"
        - "baseEventId"
        - "lastSyncedAt"
      type: "object"
    PredMdEventHit:
      description: "One event with at least one matching contract."
      properties:
        baseEventId:
          type: "string"
        contractsFound:
          description: "Every matching contract under this hit. Read them with type=contracts and eventId or baseEventId."
          minimum: 0
          type: "integer"
        eventDisplayName:
          type: "string"
        eventId:
          type: "string"
        eventQuestion:
          type: "string"
        timeSpecifier:
          type: "string"
        underlyingSpec:
          type: "string"
      required:
        - "eventId"
        - "baseEventId"
        - "contractsFound"
      type: "object"
    PredMdEventSearchResult:
      description: "One page of events. found, page and perPage count events."
      properties:
        found:
          description: "Every match, not just this page."
          minimum: 0
          type: "integer"
        hits:
          items:
            $ref: "#/components/schemas/PredMdEventHit"
          type: "array"
        page:
          minimum: 1
          type: "integer"
        perPage:
          maximum: 100
          minimum: 1
          type: "integer"
        type:
          enum:
            - "events"
          type: "string"
      required:
        - "type"
        - "hits"
        - "found"
        - "page"
        - "perPage"
      type: "object"
    PredMdEventWithContracts:
      properties:
        contracts:
          items:
            $ref: "#/components/schemas/PredMdContract"
          type: "array"
        event:
          $ref: "#/components/schemas/PredMdEvent"
      required:
        - "event"
        - "contracts"
      type: "object"
    PredMdHistoryRequest:
      description: "Single query within a batch historical-data request."
      properties:
        from:
          description: "Inclusive lower bound. Zero/omitted means unbounded."
          example: "2026-04-01T00:00:00Z"
          format: "date-time"
          type: "string"
        limit:
          description: "0 or omitted means 10000; values above 10000 are clamped to it."
          example: 500
          maximum: 10000
          minimum: 0
          type: "integer"
        symbol:
          example: "HORC_1126_Republican"
          type: "string"
        to:
          description: "Inclusive upper bound. Zero/omitted means unbounded."
          example: "2026-04-20T00:00:00Z"
          format: "date-time"
          type: "string"
      required:
        - "symbol"
      type: "object"
    PredMdHistoryResponse:
      properties:
        count:
          minimum: 0
          type: "integer"
        from:
          format: "date-time"
          type: "string"
        symbol:
          type: "string"
        ticks:
          items:
            $ref: "#/components/schemas/PredMdTick"
          type: "array"
        to:
          format: "date-time"
          type: "string"
      required:
        - "symbol"
        - "count"
        - "ticks"
      type: "object"
    PredMdSuccessEnvelope:
      description: "Standard success envelope used by all success responses. `data` is endpoint-specific."
      properties:
        data: {}
        success:
          example: true
          type: "boolean"
      required:
        - "success"
      type: "object"
    PredMdTick:
      properties:
        noPrice:
          description: "Exact decimal, serialized as a string so no client parses it through a float."
          example: "0.46"
          format: "decimal"
          type: "string"
        quantity:
          example: 10
          format: "int64"
          minimum: 0
          type: "integer"
        timestamp:
          example: "2026-04-18T13:45:01.234Z"
          format: "date-time"
          type: "string"
        yesPrice:
          description: "Exact decimal, serialized as a string so no client parses it through a float."
          example: "0.54"
          format: "decimal"
          type: "string"
      required:
        - "timestamp"
        - "yesPrice"
        - "noPrice"
        - "quantity"
      type: "object"
    PredOrdersAppError:
      description: "Structured error returned by the prediction-market order endpoints."
      properties:
        code:
          description: "Machine-readable code, e.g. `INVALID_ORDER`, `ORDER_OUTCOME_UNKNOWN`. Branch on this."
          example: "INVALID_ORDER"
          type: "string"
        details:
          additionalProperties: true
          type: "object"
        message:
          description: "Human-readable detail. Exact text is not fixed and should not be matched on."
          example: "string"
          type: "string"
        request_id:
          type: "string"
        type:
          description: "Categorical error type, in lowercase."
          enum:
            - "bad_request"
            - "authentication"
            - "not_found"
            - "conflict"
            - "rate_limit"
            - "unavailable"
            - "timeout"
            - "internal"
          example: "bad_request"
          type: "string"
          x-speakeasy-unknown-values: allow
      required:
        - "type"
        - "code"
        - "message"
      type: "object"
    PredOrdersErrorEnvelope:
      properties:
        error:
          $ref: "#/components/schemas/PredOrdersAppError"
        success:
          example: false
          type: "boolean"
      required:
        - "success"
        - "error"
      type: "object"
    PredOrdersOrder:
      description: "An order as recorded by order entry. Submitted terms (`quantity`, `price`, …) never change; working terms (`workingQuantity`, `workingPrice`, …) are the venue's answer. Optional decimals and timestamps are omitted when absent, never zero."
      properties:
        accountId:
          example: "ACCOUNT-0001"
          type: "string"
        avgPx:
          description: "Average fill price. Exact decimal as a string."
          example: "0"
          type: "string"
        certainty:
          description: "How sure order entry is of `state`. Anything other than `certain` means the order's state could not be confirmed; `certaintyReason` says why."
          enum:
            - "certain"
            - "unknown_unacked"
            - "unknown_gap"
            - "unknown_store_lost"
          type: "string"
          x-speakeasy-unknown-values: allow
        certaintyReason:
          type: "string"
        clOrdId:
          description: "Client order ID sent to the venue."
          type: "string"
        clientOrderRef:
          example: "7d1c8e0a-4b8f-4e3a-9f43-2a6b1d0c9e11"
          type: "string"
        closedAt:
          format: "date-time"
          type: "string"
        createdAt:
          format: "date-time"
          type: "string"
        cumQty:
          description: "Quantity filled so far. Exact decimal as a string."
          example: "0"
          type: "string"
        expireTime:
          format: "date-time"
          type: "string"
        firstAckAt:
          description: "When the venue first acknowledged the order."
          format: "date-time"
          type: "string"
        leavesQty:
          description: "Quantity still working. Exact decimal as a string."
          example: "10"
          type: "string"
        orderId:
          example: "0b9f3c2e-5d6a-4f1b-8e7c-9a0d1e2f3a4b"
          format: "uuid"
          type: "string"
        orderType:
          example: "limit"
          type: "string"
        outcome:
          enum:
            - "YES"
            - "NO"
          example: "YES"
          type: "string"
          x-speakeasy-unknown-values: allow
        pendingAction:
          enum:
            - "none"
            - "replace"
            - "cancel"
          type: "string"
          x-speakeasy-unknown-values: allow
        price:
          description: "Exact decimal as a string."
          example: "0.54"
          type: "string"
        quantity:
          description: "Exact decimal as a string."
          example: "10"
          type: "string"
        rejectReason:
          type: "string"
        rejectText:
          description: "The venue's own rejection text. Most rejections carry their useful detail only here."
          type: "string"
        sentAt:
          format: "date-time"
          type: "string"
        side:
          example: "buy"
          type: "string"
        state:
          description: "Order lifecycle state. `unknown` means order entry lost track of the order and says so rather than guessing; see `certainty`."
          enum:
            - "pending_new"
            - "new"
            - "partially_filled"
            - "filled"
            - "canceled"
            - "rejected"
            - "expired"
            - "done_for_day"
            - "unknown"
          example: "pending_new"
          type: "string"
          x-speakeasy-unknown-values: allow
        stopPx:
          description: "Exact decimal as a string."
          example: "0.50"
          type: "string"
        symbol:
          example: "HORC_1126_Republican"
          type: "string"
        timeInForce:
          example: "day"
          type: "string"
        updatedAt:
          format: "date-time"
          type: "string"
        venueOrderId:
          description: "Assigned by the venue on acknowledgement."
          type: "string"
        workingOrderType:
          type: "string"
        workingPrice:
          description: "Exact decimal as a string."
          example: "0.54"
          type: "string"
        workingQuantity:
          description: "Exact decimal as a string."
          example: "10"
          type: "string"
      required:
        - "orderId"
        - "accountId"
        - "symbol"
        - "outcome"
        - "side"
        - "orderType"
        - "timeInForce"
        - "quantity"
        - "workingQuantity"
        - "state"
        - "cumQty"
        - "leavesQty"
        - "avgPx"
        - "createdAt"
        - "updatedAt"
      type: "object"
    PredOrdersOrderDetail:
      description: "An order and every venue report against it, read from one snapshot."
      properties:
        order:
          $ref: "#/components/schemas/PredOrdersOrder"
        reports:
          items:
            $ref: "#/components/schemas/PredOrdersOrderReport"
          type: "array"
      required:
        - "order"
        - "reports"
      type: "object"
    PredOrdersOrderPage:
      properties:
        nextCursor:
          description: "Pass as `cursor` to fetch the next page. Absent on the last page."
          type: "string"
        orders:
          items:
            $ref: "#/components/schemas/PredOrdersOrder"
          type: "array"
      required:
        - "orders"
      type: "object"
    PredOrdersOrderReport:
      description: "One venue execution report against the order. Quantities and prices are omitted when the venue did not send them for that report type."
      properties:
        avgPx:
          description: "Exact decimal as a string."
          example: "0.54"
          type: "string"
        bustedAt:
          description: "Set when the venue later cancelled this trade."
          format: "date-time"
          type: "string"
        cumQty:
          description: "Exact decimal as a string."
          example: "10"
          type: "string"
        execId:
          type: "string"
        execType:
          example: "trade"
          type: "string"
        lastPx:
          description: "Exact decimal as a string."
          example: "0.54"
          type: "string"
        lastQty:
          description: "Exact decimal as a string."
          example: "10"
          type: "string"
        leavesQty:
          description: "Exact decimal as a string."
          example: "0"
          type: "string"
        status:
          example: "filled"
          type: "string"
        text:
          type: "string"
        transactTime:
          format: "date-time"
          type: "string"
      required:
        - "execId"
        - "execType"
        - "status"
        - "transactTime"
      type: "object"
    PredOrdersPlaceOrderRequest:
      additionalProperties: false
      description: "Unknown fields are rejected with `400`. The user is always the authenticated caller and cannot be named in the body."
      properties:
        accountId:
          description: "The account to place the order on."
          example: "ACCOUNT-0001"
          type: "string"
        clientOrderRef:
          description: "Your own reference for the order, unique per account. Reusing one returns `409` `CLIENT_ORDER_REF_IN_USE`; it is not a retry key. To retry safely, use the `Idempotency-Key` header."
          example: "7d1c8e0a-4b8f-4e3a-9f43-2a6b1d0c9e11"
          type: "string"
        expireTime:
          description: "Required when `timeInForce` is `gtd`."
          format: "date-time"
          type: "string"
        orderType:
          enum:
            - "limit"
            - "stop"
            - "stop_limit"
            - "market_to_limit"
          example: "limit"
          type: "string"
          x-speakeasy-unknown-values: allow
        outcome:
          description: "The binary outcome the order trades. It is never inferred from `side`."
          enum:
            - "YES"
            - "NO"
          example: "YES"
          type: "string"
          x-speakeasy-unknown-values: allow
        price:
          description: "Limit price as an exact decimal string. Required for `limit` and `stop_limit`."
          example: "0.54"
          type: "string"
        quantity:
          description: "Number of contracts as an exact decimal string. Must be greater than zero."
          example: "10"
          type: "string"
        side:
          enum:
            - "buy"
            - "sell"
          example: "buy"
          type: "string"
          x-speakeasy-unknown-values: allow
        stopPx:
          description: "Stop price as an exact decimal string. Required for `stop` and `stop_limit`."
          example: "0.50"
          type: "string"
        symbol:
          description: "Prediction-market contract symbol, as returned by search or Get Event Contracts."
          example: "HORC_1126_Republican"
          type: "string"
        timeInForce:
          enum:
            - "day"
            - "gtc"
            - "ioc"
            - "fok"
            - "gtd"
          example: "day"
          type: "string"
          x-speakeasy-unknown-values: allow
      required:
        - "accountId"
        - "symbol"
        - "outcome"
        - "side"
        - "orderType"
        - "timeInForce"
        - "quantity"
      type: "object"
    PreviewOrderResponse:
      description: "Response schema for order preview (PreviewOrdResponse)"
      properties:
        buyingPowerImpact:
          description: "Estimated reduction in available buying power if the order is submitted. Present in both equity and option previews. Use this before Place Order to confirm the account can support the trade."
          example: "1500.01"
          type: "string"
        commission:
          description: "Estimated commission for the order. Present in both equity and option previews. Show this as part of the total trading cost."
          example: "0.00"
          type: "string"
        errors:
          description: "Blocking validation or risk errors returned by preview. Can appear for either equity or option previews. Do not call Place Order until these are resolved."
          items:
            type: "string"
          type: "array"
        estimatedCost:
          description: "Estimated cash cost of the order before it is placed. Present in both equity and option previews. Use this to show the user the expected trade cost during review."
          example: "1500.00"
          type: "string"
        estimatedMargin:
          description: "Estimated margin requirement for the order. Present in both equity and option previews. Use this to explain how much margin capacity the order may consume."
          example: "0.00"
          type: "string"
        fees:
          description: "Estimated regulatory and exchange fees. Present in both equity and option previews. Add this to commissions and order cost when showing total estimated cost."
          example: "0.01"
          type: "string"
        numDayTrades:
          description: "Estimated number of day trades this order would count toward. Present in both equity and option previews. Use this to warn pattern-day-trader-sensitive users."
          example: 0
          type: "integer"
        optionFees:
          description: "Estimated option-specific fees. Present only in the option preview. For equity previews this is typically omitted or zero."
          example: "0.70"
          type: "string"
        optionPremium:
          description: "Estimated premium paid or received for an option order. Present only in the option preview. For equity previews this is typically omitted or zero."
          example: "550.00"
          type: "string"
        optionRequirement:
          description: "Estimated option requirement or margin requirement for the option strategy. Present only in the option preview. For equity previews this is typically omitted or zero."
          example: "0.00"
          type: "string"
        warnRuleId:
          description: "Identifier for a warning rule triggered by the preview. Present in both equity and option previews when applicable. Use with `warnings` when present."
          example: "0"
          type: "string"
        warnings:
          description: "Non-blocking warnings returned by preview. Can appear for either equity or option previews. Show these to the user before they submit the live order."
          items:
            type: "string"
          type: "array"
      type: "object"
    PriceTargetResponse:
      description: "Analyst price target consensus for a stock (high, low, mean, median and analyst count), sourced from Finnhub."
      properties:
        lastUpdated:
          description: "Time the consensus was last updated, as reported by Finnhub"
          type: "string"
        numberAnalysts:
          description: "Number of analysts contributing to the consensus"
          type: "integer"
        symbol:
          description: "Stock ticker symbol"
          type: "string"
        targetHigh:
          description: "Highest analyst price target"
          type: "number"
        targetLow:
          description: "Lowest analyst price target"
          type: "number"
        targetMean:
          description: "Mean analyst price target"
          type: "number"
        targetMedian:
          description: "Median analyst price target"
          type: "number"
      type: "object"
    QuoteData:
      description: "One quote record in a quote response. Use `s` to match each record back to the requested symbol."
      properties:
        n:
          description: "Display name returned for the quoted instrument or venue."
          type: "string"
        s:
          description: "Symbol this quote record belongs to. Match this against the symbol requested in the `symbols` query."
          type: "string"
        v:
          $ref: "#/components/schemas/QuoteValues"
      type: "object"
    QuoteValues:
      description: "Market quote values for a symbol. Use bid/ask for trading decisions and last price for display context."
      properties:
        ask:
          description: "Lowest price sellers are currently willing to accept. Buyers usually compare their limit price to the ask."
          type: "number"
        bid:
          description: "Highest price buyers are currently offering. Sellers usually compare their limit price to the bid."
          type: "number"
        ch:
          description: "Dollar price change from the previous close. Use this for quote tiles and daily move displays."
          type: "number"
        chp:
          description: "Percent change from the previous close. Use this to show the daily move as a percentage."
          type: "number"
        description:
          description: "Full company or instrument description. Show it when users need to confirm the symbol they are viewing."
          type: "string"
        exchange:
          description: "Exchange code where the data originates. Format depends on the upstream data source and may use MIC, ISO 10383, or a vendor-specific code."
          type: "string"
        high_price:
          description: "Highest price for the day"
          type: "number"
        low_price:
          description: "Lowest traded price during the current session. Use it for daily range displays."
          type: "number"
        lp:
          description: "Last traded price. Use this as the current reference price, but use bid and ask when estimating immediate buy or sell cost."
          type: "number"
        open_price:
          description: "Opening price for the day"
          type: "number"
        prev_close_price:
          description: "Previous day's closing price"
          type: "number"
        short_name:
          description: "Short name of the company"
          type: "string"
        volume:
          description: "Number of shares or contracts traded during the current session, when available."
          type: "number"
      type: "object"
    QuotesResponse:
      description: "Response body for quote requests. Use it to render current market prices for one or more symbols."
      properties:
        d:
          description: "Quote records for the requested symbols. Iterate this array and use each record's `s` value to match the symbol."
          items:
            $ref: "#/components/schemas/QuoteData"
          type: "array"
        s:
          description: "Overall quote response status. `ok` means quote data was returned; `error` means the request could not be fulfilled."
          enum:
            - "ok"
            - "error"
          type: "string"
          x-speakeasy-unknown-values: allow
      type: "object"
    Rating:
      description: "Single analyst rating. Fields use snake_case; some fields may be absent when empty."
      properties:
        action_company:
          description: "Rating action taken by the analyst firm, such as upgrades, downgrades, initiates or reiterates."
          type: "string"
        action_pt:
          description: "Action taken on the price target, such as raised, lowered, maintained or announced."
          type: "string"
        analyst:
          description: "Name of the analyst firm that issued the rating."
          type: "string"
        analyst_id:
          description: "Provider identifier of the analyst firm."
          type: "string"
        analyst_name:
          description: "Name of the individual analyst who issued the rating."
          type: "string"
        currency:
          description: "Currency code the price target values are denominated in."
          type: "string"
        date:
          description: "Date the rating was issued, as supplied by Benzinga."
          type: "string"
        exchange:
          description: "Exchange code where the data originates. Format depends on the upstream data source and may use MIC, ISO 10383, or a vendor-specific code."
          type: "string"
        id:
          description: "Provider identifier of the analyst rating record."
          type: "string"
        importance:
          description: "Provider-assigned importance level of the rating event."
          format: "int64"
