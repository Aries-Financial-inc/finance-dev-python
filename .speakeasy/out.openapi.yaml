    IndexGroup:
      description: |-
        Identifier of an index data group. Each group is a publisher / index family. Use [GET /v1/indices/groups](/api-reference/supplemental/indices-groups) at runtime to get the live list — the list below is the current published set:
        - `IND_CBOC` — CBOE Data Services CMSI – Crypto Feed
        - `IND_CBOCGI` — CBOE Global Indices
        - `IND_CBOF` — CBOE Data Services CMSI – FTSE
        - `IND_CBOI` — CBOE Data Services CMSI – iNAV
        - `IND_CBOM` — CBOE Data Services CSMI (S&P 500, NASDAQ Composite, etc.)
        - `IND_CBOMSTAR` — CBOE Data Services CSMI – Morningstar
        - `IND_DJI` — Dow Jones Indices
        - `IND_GIDS` — Nasdaq Global Index Data Service
        - `IND_GIF` — NYSE Global Indices
        - `IND_SPF` — S&P Complete Indices
        - `INDBVMF` — B3 / Brazil (Bm_Fbovespa)
        - `INDXNSE` — National Stock Exchange of India
        - `INDXSTU` — Borse Stuttgart
        - `INDXTSE` — Toronto Stock Exchange
      example: "IND_CBOM"
      type: "string"
    IndexGroupsResponse:
      description: "Response containing the available index groups."
      properties:
        indexGroups:
          description: "Array of available index groups"
          items:
            properties:
              description:
                description: "Human-readable description of the index group"
                example: "CBOE Data Services CMSI - Crypto Fee"
                type: "string"
              name:
                description: "Unique identifier for the index group"
                example: "IND_CBOC"
                type: "string"
            type: "object"
          type: "array"
      type: "object"
    IndexListResponse:
