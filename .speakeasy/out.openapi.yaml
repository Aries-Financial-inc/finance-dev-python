    AppError:
      description: "Structured application error returned inside an `ErrorEnvelope`."
      properties:
        code:
          description: "Machine-readable code, e.g. `SYMBOL_REQUIRED`, `EVENT_NOT_FOUND`."
          example: "SYMBOL_REQUIRED"
          type: "string"
        details:
          additionalProperties: true
          type: "object"
        message:
          description: "Error detail as a string. Exact message content is not fixed and should not be hard-coded."
          example: "string"
          type: "string"
        operation:
          type: "string"
        request_id:
          type: "string"
        service:
          type: "string"
        type:
          description: |-
            Categorical error type. Use this for branching error-handling logic; the values are stable across endpoints:
            - `VALIDATION` — request body or query parameters failed validation.
            - `AUTHENTICATION` — missing, invalid, or expired token.
            - `AUTHORIZATION` — token is valid but lacks the required scope/permission.
            - `NOT_FOUND` — the requested resource does not exist.
            - `CONFLICT` — request conflicts with current state (e.g. duplicate).
            - `INTERNAL` — server-side error; retry or contact support.
            - `TIMEOUT` — operation took too long.
            - `UNKNOWN` — uncategorized error; check `message`.
            (Additional categorical values may appear in service-specific responses.)
          enum:
            - "UNKNOWN"
            - "VALIDATION"
            - "AUTHENTICATION"
            - "AUTHORIZATION"
            - "NOT_FOUND"
            - "CONFLICT"
            - "INTERNAL"
            - "TIMEOUT"
            - "RATE_LIMIT"
            - "BAD_REQUEST"
            - "DATABASE"
            - "EXTERNAL_SERVICE"
            - "PRECONDITION_FAILED"
            - "SERVICE_UNAVAILABLE"
            - "GRPC"
            - "QUEUE"
            - "JSON_PARSING"
          type: "string"
          x-speakeasy-unknown-values: allow
      required:
        - "type"
        - "code"
        - "message"
      type: "object"
    AuthenticationErrorDetail:
      description: "Structured payload for the nested `error` object. Services using the shared Go error writer emit uppercase `type` values aligned with error categories (for example `VALIDATION`, `BAD_REQUEST`, `AUTHENTICATION`, `AUTHORIZATION`, `NOT_FOUND`, `RATE_LIMIT`, `INTERNAL`)."
      properties:
        code:
          description: "Machine-readable code"
          example: "INVALID_TOKEN"
          type: "string"
        details:
          additionalProperties: true
          description: "Optional extra context"
          type: "object"
        message:
          description: "Error detail as a string. Exact message content is not fixed and should not be hard-coded."
          example: "string"
          type: "string"
        request_id:
          description: "Request correlation id when provided"
          type: "string"
        type:
          description: "Error category emitted by the shared error writer, such as VALIDATION, BAD_REQUEST, AUTHENTICATION, AUTHORIZATION, NOT_FOUND, RATE_LIMIT, or INTERNAL."
          example: "AUTHENTICATION"
          type: "string"
      type: "object"
    AuthenticationErrorEnvelope:
      description: "JSON envelope where `error` is a nested object (`type`, `code`, `message`, …). Many services use this shape for 400, 401, 403, 404, and 5xx when using the shared HTTP error format."
      properties:
        error:
          $ref: "#/components/schemas/AuthenticationErrorDetail"
        meta:
          additionalProperties: true
          description: "Optional metadata"
          type: "object"
      type: "object"
