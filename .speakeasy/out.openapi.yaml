  /v1/stock/screener:
    post:
      description: "Screen securities by sending a JSON body with operator and clauses (and optional groups). At least one clause or group is required. Query params: page_size, order_column, order_direction, primary_only. **Required scope:** analytics:information"
      operationId: "stockScreener"
      parameters:
        - description: "Number of results to return per page. Use smaller values (10–50) for UI screens, larger (100–500) for batch exports. Defaults to the upstream provider's default."
          in: "query"
          name: "page_size"
          schema:
            maximum: 50000
            minimum: 1
            type: "integer"
        - description: |-
            Which data column to sort the screened results by. Accepts any column the upstream screener exposes — not a fixed enum on our side. Common columns:
            - `marketcap` — market capitalization.
            - `pricetoearnings` — trailing P/E ratio.
            - `pricetobook` — price-to-book ratio.
            - `roe` — return on equity.
            - `volume` — average daily volume.
            - `open_price` / `close_price` — most recent open / close.
            - `dilutedeps` — diluted earnings per share (TTM).
            - `cashandequivalents` — cash + cash equivalents on the balance sheet.

            Pair with `order_direction` (`asc` / `desc`).
          in: "query"
          name: "order_column"
          schema:
            type: "string"
        - description: |-
            Direction to sort `order_column` in:
            - `asc` — ascending (smallest first).
            - `desc` — descending (largest first).
          in: "query"
          name: "order_direction"
          schema:
            $ref: "#/components/schemas/SortOrderEnum"
        - description: "When `true`, return only the primary listing for each company (e.g. NYSE for a U.S. dual-listed stock) instead of every listing. Defaults to `false`."
          in: "query"
          name: "primary_only"
          schema:
            type: "string"
      requestBody:
        content:
          application/json:
            examples:
              marketCapAndPE:
                summary: "Market cap and P/E filter"
                value:
                  clauses:
                    - field: "marketcap"
                      operator: "gte"
                      value: "1000000000"
                    - field: "pricetoearnings"
                      operator: "gte"
                      value: "5"
                    - field: "pricetoearnings"
                      operator: "lte"
                      value: "25"
                  operator: "AND"
              roeAndEps:
                summary: "ROE and EPS filter"
                value:
                  clauses:
                    - field: "roe"
                      operator: "gte"
                      value: "0.15"
                    - field: "dilutedeps"
                      operator: "gte"
                      value: "1"
                  operator: "AND"
            schema:
              $ref: "#/components/schemas/StockScreenerRequest"
        description: "Screener request with operator (AND, OR, or NOT), clauses (field, operator, value), and optional groups."
        required: true
      responses:
        "200":
          content:
            application/json:
              example:
                - data:
                    - number_value: 24.2204
                      tag: "pricetoearnings"
                      text_value: null
                    - number_value: 2888569710564
                      tag: "marketcap"
                      text_value: null
                  security:
                    code: null
                    company_id: "com_qzEByJ"
                    composite_figi: null
                    composite_ticker: "MSFT:US"
                    currency: null
                    exchange: null
                    exchange_mic: null
                    figi: "BBG000BPHFS9"
                    id: "sec_XaL6mg"
                    name: "Microsoft Corporation"
                    primary_listing: null
                    share_class_figi: null
                    stock_exchange_id: "sxg_ozMr9y"
                    ticker: "MSFT"
              schema:
                $ref: "#/components/schemas/StockScreenerResponse"
          description: "Array of screened securities; each item has security (id, ticker, name, etc.) and data (array of tag, number_value, text_value)"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalServerError"
      security:
