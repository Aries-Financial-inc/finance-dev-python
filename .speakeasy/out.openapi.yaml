                  type: "number"
                priceToEarnings:
                  description: "Price-to-earnings ratio of the ETF."
                  type: "number"
                trackingIndex:
                  description: "Index tracked by the ETF."
                  type: "string"
                website:
                  description: "URL of the ETF website."
                  type: "string"
              type: "object"
            symbol:
              description: "ETF ticker symbol."
              type: "string"
          type: "object"
      type: "object"
    EtfSectorAllocationResponse:
      description: "Sector exposure breakdown of an ETF from Finnhub."
      properties:
        data:
          description: "ETF sector exposure payload."
