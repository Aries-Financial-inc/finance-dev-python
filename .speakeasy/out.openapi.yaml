        strategy: backoff
        backoff:
          initialInterval: 500
          maxInterval: 8000
          maxElapsedTime: 60000
          exponent: 1.5
        statusCodes:
          - 429
          - 500
          - 502
          - 503
          - 504
        retryConnectionErrors: true
      x-speakeasy-group: watchlist
      x-speakeasy-name-override: list
    post:
      description: |-
        Create a new watchlist for the authenticated user. Watchlist names must be unique per user; creating a watchlist with a name the user already has returns 400 with error code `WATCHLIST_ALREADY_EXISTS`.

        **Symbol validation:** Submitted symbols are uppercased, de-duplicated, and checked against the symbol resolver. Symbols that can't be resolved are dropped from the stored list and returned in the response's `invalid_symbols` field instead of causing the request to fail.
      operationId: "createConfigWatchlist"
      requestBody:
        content:
          application/json:
            examples:
              createWatchlist:
                summary: "Create a watchlist with symbols"
                value:
                  name: "Tech Stocks"
                  symbols:
                    - "AAPL"
                    - "GOOGL"
                    - "MSFT"
            schema:
              $ref: "#/components/schemas/CreateWatchlistRequest"
        description: "Name and initial symbols for the new watchlist. `name` is required; `symbols` is optional."
        required: true
      responses:
        "201":
          content:
            application/json:
              examples:
                created:
                  summary: "Watchlist created"
                  value:
                    id: 12345
                    name: "Tech Stocks"
                    symbols:
                      - "AAPL"
                      - "GOOGL"
                      - "MSFT"
                createdWithInvalidSymbols:
                  summary: "Watchlist created, one submitted symbol could not be resolved"
                  value:
                    id: 12346
                    invalid_symbols:
                      - "NOTASYMBOL"
                    name: "Tech Stocks"
                    symbols:
                      - "AAPL"
                      - "GOOGL"
              schema:
                $ref: "#/components/schemas/Watchlist"
          description: "Watchlist created. The response contains the saved watchlist; check `invalid_symbols` for any submitted symbols that were dropped."
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "500":
          $ref: "#/components/responses/InternalServerError"
      security:
        - OAuth2:
            - "watchlist:management"
      summary: "Create Watchlist"
      tags:
        - "Watchlist"
      x-speakeasy-group: watchlist
      x-speakeasy-name-override: create
    put:
      description: |-
        Replace the authenticated user's entire set of watchlists in a single call. Send the full desired list as an array: entries matching an existing watchlist by `name` (exact, case-sensitive) are updated in place, keeping their `id` and replacing their `symbols`; entries with a new `name` are created; and every existing watchlist whose `name` is **not** present in the array is deleted. Sending an empty array `[]` deletes all of the user's watchlists and creates a single new `"Default"` watchlist with no symbols.

        Unlike Create and Update, symbols sent here are stored as-is and are **not** uppercased or checked against the symbol resolver. If `symbols` is omitted for an entry, that watchlist is stored with `symbols: null`.
      operationId: "replaceConfigWatchlists"
      requestBody:
        content:
          application/json:
            examples:
              replaceAll:
                summary: "Replace with two watchlists"
                value:
                  - name: "Tech Stocks"
                    symbols:
                      - "AAPL"
                      - "GOOGL"
                      - "MSFT"
                  - name: "Finance"
                    symbols:
                      - "JPM"
                      - "BAC"
                      - "GS"
              resetAll:
                summary: "Reset to default by sending an empty array"
                value: []
            schema:
              items:
                $ref: "#/components/schemas/WatchlistRequest"
              type: "array"
        description: "The complete desired set of watchlists. Each entry's `name` must be unique within the array, and `symbols` must not contain duplicates within an entry."
        required: true
      responses:
        "201":
          content:
            application/json:
              examples:
                replaced:
                  summary: "Resulting set after replace (user had multiple watchlists)"
                  value:
                    user_id: 98765
                    watchlist:
                      - id: 12345
                        name: "Tech Stocks"
                        symbols:
                          - "AAPL"
                          - "GOOGL"
                          - "MSFT"
                      - id: 12347
                        name: "Finance"
                        symbols:
                          - "JPM"
                          - "BAC"
                          - "GS"
                resetToDefault:
                  summary: "User reset to a single Default watchlist (empty array sent)"
                  value:
                    user_id: 98765
                    watchlist:
                      - id: 12348
                        name: "Default"
                        symbols: []
              schema:
                $ref: "#/components/schemas/WatchlistResponse"
          description: "The full, resulting set of watchlists after the replace, in request order. Sending an empty array resets the user to a single new \"Default\" watchlist with no symbols."
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "500":
          $ref: "#/components/responses/InternalServerError"
      security:
        - OAuth2:
            - "watchlist:management"
      summary: "Replace All Watchlists"
      tags:
        - "Watchlist"
      x-speakeasy-retries:
        strategy: backoff
        backoff:
          initialInterval: 500
          maxInterval: 8000
          maxElapsedTime: 60000
          exponent: 1.5
        statusCodes:
          - 429
          - 500
          - 502
          - 503
          - 504
        retryConnectionErrors: true
      x-speakeasy-group: watchlist
      x-speakeasy-name-override: replaceAll
